/* ---------- QUIZ FLOW ---------- */
function startQuiz(){
  const name = document.getElementById('driverName').value.trim();
  const id = document.getElementById('driverID').value.trim();
  const alertBox = document.getElementById('validation-alert');
  if(!name || !id){
    alertBox.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  alertBox.style.display = 'none';
  const shuffled = shuffleArray(QUESTION_BANK);
  currentQuestions = shuffled.slice(0, 20);
  userAnswers = {};
  renderQuestions(currentLang);
  document.getElementById('start-banner').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  document.getElementById('quiz-section').scrollIntoView({behavior:'smooth'});
  startTimer();
}
function renderQuestions(lang){
  const t = UI[lang];
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  currentQuestions.forEach((qObj, index) => {
    const qNum = index + 1;
    const qBlock = document.createElement('div');
    qBlock.className = 'question-block';
    const labels = ['A','B','C'];
    let optionsHTML = '';
    qObj[lang].a.forEach((optText, optIdx) => {
      const checked = userAnswers[index] === optIdx ? 'checked' : '';
      optionsHTML += `<label class="option">
        <input type="radio" name="q${index}" value="${optIdx}" ${checked} onchange="recordAnswer(${index}, ${optIdx})">
        <span>${labels[optIdx]}. ${optText}</span>
      </label>`;
    });
    qBlock.innerHTML = `<div class="question-title">${t.questionWord} ${qNum}: ${qObj[lang].q}</div>${optionsHTML}`;
    container.appendChild(qBlock);
  });
  updateProgressBadge();
}
function recordAnswer(index, value){
  userAnswers[index] = value;
  updateProgressBadge();
}
function updateProgressBadge(){
  const el = document.getElementById('progressBadge');
  if(!el) return;
  const t = UI[currentLang];
  const answered = Object.keys(userAnswers).length;
  el.textContent = currentQuestions.length ? `${t.progressPrefix}: ${answered}/${currentQuestions.length}` : '';
}
function startTimer(){
  timeLeft = 20*60;
  updateTimerBadge();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerBadge();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      submitQuiz();
    }
  }, 1000);
}
function updateTimerBadge(){
  const badge = document.getElementById('timerBadge');
  const m = Math.floor(timeLeft/60);
  const s = timeLeft % 60;
  badge.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  badge.classList.toggle('low', timeLeft <= 60);
}
function submitQuiz(){
  clearInterval(timerInterval);
  const t = UI[currentLang];
  const total = currentQuestions.length;
  let score = 0;
  const labels = ['A','B','C'];
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  currentQuestions.forEach((qObj, index) => {
    const chosen = userAnswers[index];
    const isCorrect = chosen === qObj.correct;
    if(isCorrect) score++;
    const div = document.createElement('div');
    div.className = 'review-item ' + (isCorrect ? 'correct' : 'wrong');
    const chosenText = (chosen !== undefined) ? `${labels[chosen]}. ${qObj[currentLang].a[chosen]}` : t.notAnswered;
    const correctText = `${labels[qObj.correct]}. ${qObj[currentLang].a[qObj.correct]}`;
    div.innerHTML = `<strong>${t.questionWord} ${index+1}:</strong> ${qObj[currentLang].q}<br>${t.yourAnswer}: ${chosenText}${isCorrect ? '' : `<br>${t.correctAnswer}: ${correctText}`}`;
    reviewList.appendChild(div);
  });
  const percentage = Math.round((score/total)*100);
  const isPassed = score >= 16;
  const name = document.getElementById('driverName').value.trim();
  const id = document.getElementById('driverID').value.trim();
  document.getElementById('resStudentLine').innerHTML = `${t.studentLine}: <strong>${escUser(name)}</strong> | ID: <strong>${escUser(id)}</strong>`;
  document.getElementById('resScore').textContent = `${score}/${total} (${percentage}%)`;
  const statusEl = document.getElementById('resStatus');
  const trophyEl = document.getElementById('resTrophy');
  if(isPassed){
    statusEl.className = 'status-pass';
    statusEl.textContent = t.resPass;
    trophyEl.textContent = '🏆';
  } else {
    statusEl.className = 'status-fail';
    statusEl.textContent = t.resFail;
    trophyEl.textContent = '⚠️';
  }
  selectedRating = null;
  document.getElementById('submitRow').style.display = 'block';
  document.getElementById('exitRow').style.display = 'none';
  document.getElementById('exitMsg').style.display = 'none';
  document.getElementById('submitStatus').textContent = '';
  document.getElementById('ratingRequiredMsg').style.display = 'none';
  document.getElementById('btnSubmitResult').disabled = false;
  buildRatingScale(currentLang);
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('result-block').style.display = 'block';
  document.getElementById('result-block').scrollIntoView({behavior:'smooth'});
}
function buildRatingScale(lang){
  const scale = document.getElementById('ratingScale');
  if(!scale) return;
  scale.innerHTML = '';
  for(let i=1;i<=10;i++){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rating-btn' + (selectedRating === i ? ' selected' : '');
    btn.textContent = i;
    btn.onclick = () => {
      selectedRating = i;
      buildRatingScale(lang);
      document.getElementById('ratingRequiredMsg').style.display = 'none';
    };
    scale.appendChild(btn);
  }
}
/* ---------- SUBMIT TO FIRESTORE ---------- */
function buildSubmissionPayload(){
  const name = document.getElementById('driverName').value.trim();
  const id = document.getElementById('driverID').value.trim();
  const labels = ['A','B','C'];
  let score = 0;
  // Gộp luôn kết quả đúng/sai theo từng kỹ năng (module) để nuôi bảng "Kết quả theo
  // từng kỹ năng" công khai — chỉ là số liệu tổng hợp (đúng/tổng câu mỗi kỹ năng),
  // không phải nội dung câu trả lời nên an toàn khi đưa vào collection công khai.
  const moduleScores = {}; // { '1': {correct, total}, '2': {...}, ... }
  const questions = currentQuestions.map((qObj, index) => {
    const chosen = userAnswers[index];
    const isCorrect = chosen === qObj.correct;
    if(isCorrect) score++;
    const mKey = String(qObj.m);
    if(!moduleScores[mKey]) moduleScores[mKey] = {correct:0, total:0};
    moduleScores[mKey].total++;
    if(isCorrect) moduleScores[mKey].correct++;
    return {
      question: qObj[currentLang].q,
      options: qObj[currentLang].a,
      selectedIndex: (chosen !== undefined) ? chosen : null,
      selectedText: (chosen !== undefined) ? `${labels[chosen]}. ${qObj[currentLang].a[chosen]}` : null,
      correctIndex: qObj.correct,
      correctText: `${labels[qObj.correct]}. ${qObj[currentLang].a[qObj.correct]}`,
      module: qObj.m,
      isCorrect
    };
  });
  const total = currentQuestions.length;
  const percentage = total ? Math.round((score/total)*100) : 0;
  return {
    name, employeeId: id,
    language: currentLang,
    score, total, percentage,
    passed: score >= 16,
    rating: selectedRating,
    moduleScores,
    questions,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
    clientSubmittedAt: new Date().toISOString()
  };
}
function submitResultToFirebase(){
  const t = UI[currentLang];
  const statusEl = document.getElementById('submitStatus');
  const reqMsgEl = document.getElementById('ratingRequiredMsg');
  if(!selectedRating){
    reqMsgEl.textContent = t.ratingRequiredMsg;
    reqMsgEl.style.display = 'block';
    reqMsgEl.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  reqMsgEl.style.display = 'none';
  if(!FIREBASE_CONFIGURED || !db){
    statusEl.style.color = 'var(--fail-red)';
    statusEl.textContent = t.notConfiguredMsg;
    return;
  }
  const btn = document.getElementById('btnSubmitResult');
  btn.disabled = true;
  statusEl.style.color = '#555';
  statusEl.textContent = t.submittingMsg;
  // Ghi 2 bản ghi riêng biệt trong cùng 1 batch (đảm bảo cùng thành công/thất bại):
  //  - quiz_submissions: đầy đủ tên/ID/chi tiết câu trả lời (chỉ admin đọc được qua Firebase Console).
  //  - quiz_stats_public: KHÔNG chứa tên/ID, chỉ có điểm số + kết quả theo từng kỹ năng + đánh giá —
  //    toàn là số liệu tổng hợp, không định danh được ai — an toàn để mọi người đọc công khai
  //    cho bảng thống kê ở đầu trang.
  const payload = buildSubmissionPayload();
  const publicStats = {
    score: payload.score,
    total: payload.total,
    percentage: payload.percentage,
    passed: payload.passed,
    rating: payload.rating,
    moduleScores: payload.moduleScores,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const batch = db.batch();
  batch.set(db.collection('quiz_submissions').doc(), payload);
  batch.set(db.collection('quiz_stats_public').doc(), publicStats);
  batch.commit().then(() => {
    statusEl.style.color = 'var(--pass-green)';
    statusEl.textContent = t.submitSuccessMsg;
    document.getElementById('submitRow').style.display = 'none';
    document.getElementById('exitRow').style.display = 'flex';
    loadPublicStats(); // cập nhật ngay bảng thống kê ở đầu trang với bài vừa nộp
  }).catch((err) => {
    console.error('Lỗi khi nộp bài lên Firestore:', err);
    statusEl.style.color = 'var(--fail-red)';
    statusEl.textContent = t.submitErrorMsg;
    btn.disabled = false;
  });
}
/* ---------- PUBLIC STATS DASHBOARD (chỉ hiện số lượng, không có tên/email) ---------- */
// Vẽ biểu đồ donut (Đạt/Chưa đạt) + các ô tóm tắt. Rê chuột (hover) vào từng phần
// của donut sẽ hiện tooltip cho biết số người và tỉ lệ % của phần đó.
function renderStatsTiles(result){
  const t = UI[currentLang];
  lastStatsResult = result;
  const dash = document.getElementById('statsDashboard');
  dash.innerHTML = '';
  if(!result.total){
    const empty = document.createElement('div');
    empty.className = 'stats-empty';
    empty.textContent = t.statsEmpty;
    dash.appendChild(empty);
    document.getElementById('statsModules').innerHTML = '';
    document.getElementById('statsRating').innerHTML = '';
    return;
  }
  const r = 54, cx = 70, cy = 70, sw = 18;
  const circumference = 2 * Math.PI * r;
  const passedPct = Math.round((result.passed / result.total) * 100);
  const failedPct = 100 - passedPct;
  const passedLen = (result.passed / result.total) * circumference;
  const svgNS = 'http://www.w3.org/2000/svg';

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 140 140');
  const bg = document.createElementNS(svgNS, 'circle');
  bg.setAttribute('cx', cx); bg.setAttribute('cy', cy); bg.setAttribute('r', r);
  bg.setAttribute('fill', 'none'); bg.setAttribute('stroke', '#E0E0E0'); bg.setAttribute('stroke-width', sw);
  svg.appendChild(bg);
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
  svg.appendChild(g);

  function addSeg(len, offset, color, tooltipText){
    if(len <= 0) return;
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('class', 'stats-donut-seg');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke', color);
    c.setAttribute('stroke-width', sw);
    c.setAttribute('stroke-dasharray', `${len} ${circumference - len}`);
    c.setAttribute('stroke-dashoffset', String(offset));
    c.addEventListener('mouseenter', (e) => showStatsTooltip(e, tooltipText));
    c.addEventListener('mousemove', (e) => moveStatsTooltip(e));
    c.addEventListener('mouseleave', hideStatsTooltip);
    g.appendChild(c);
  }
  addSeg(passedLen, 0, '#2E7D32', `${t.statsPassed}: ${result.passed}${t.statsPeopleUnit} (${passedPct}%)`);
  addSeg(circumference - passedLen, -passedLen, '#C62828', `${t.statsFailed}: ${result.failed}${t.statsPeopleUnit} (${failedPct}%)`);

  const donutWrap = document.createElement('div');
  donutWrap.className = 'stats-donut-wrap';
  donutWrap.appendChild(svg);
  const center = document.createElement('div');
  center.className = 'stats-donut-center';
  center.innerHTML = `<div class="stat-num">${result.total}</div><div class="stat-label">${t.statsTotal}</div>`;
  donutWrap.appendChild(center);

  const sideTiles = document.createElement('div');
  sideTiles.className = 'stats-side-tiles';
  sideTiles.innerHTML = `
    <div class="stat-tile pass"><div class="stat-num">${result.passed}</div><div class="stat-label">${t.statsPassed}</div></div>
    <div class="stat-tile fail"><div class="stat-num">${result.failed}</div><div class="stat-label">${t.statsFailed}</div></div>
    <div class="stat-tile"><div class="stat-num">${result.avgPct}%</div><div class="stat-label">${t.statsAvg}</div></div>
  `;

  dash.appendChild(donutWrap);
  dash.appendChild(sideTiles);
  renderStatsModules(result);
  renderStatsRating(result);
}
// Kết quả theo từng kỹ năng (module): % câu trả lời đúng, gộp từ toàn bộ lượt nộp bài
// trong khoảng thời gian đang lọc — dùng moduleScores công khai (không có nội dung câu hỏi).
function renderStatsModules(result){
  const t = UI[currentLang];
  const wrap = document.getElementById('statsModules');
  wrap.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'stats-section-title';
  title.textContent = t.statsModulesTitle;
  wrap.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'stats-modules-grid';
  const moduleAgg = result.moduleAgg || {};
  MODULES.forEach(mod => {
    const mKey = mod.id.replace('m', '');
    const agg = moduleAgg[mKey];
    const pct = (agg && agg.total) ? Math.round((agg.correct / agg.total) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'module-stat-row';
    row.innerHTML = `
      <div class="module-stat-top">
        <span class="module-stat-label">${mod.title[currentLang]}</span>
        <span class="module-stat-pct">${pct}%</span>
      </div>
      <div class="module-stat-bar"><div class="module-stat-fill" style="width:${pct}%;"></div></div>
    `;
    grid.appendChild(row);
  });
  wrap.appendChild(grid);
}
// Đánh giá mức độ hài lòng trung bình (thang 1-10) hiển thị dạng sao vàng (5 sao, lấp
// đầy tỉ lệ theo % của thang 10) kèm số cụ thể.
function renderStatsRating(result){
  const t = UI[currentLang];
  const wrap = document.getElementById('statsRating');
  wrap.innerHTML = '';
  const avgRating = result.avgRating || 0;
  const fillPct = Math.max(0, Math.min(100, (avgRating / 10) * 100));
  const title = document.createElement('div');
  title.className = 'stats-section-title';
  title.textContent = t.statsRatingTitle;
  wrap.appendChild(title);
  const row = document.createElement('div');
  row.className = 'stats-rating-row';
  const starsWrap = document.createElement('span');
  starsWrap.className = 'stars-wrap';
  starsWrap.style.setProperty('--fill', fillPct + '%');
  starsWrap.innerHTML = `<span class="stars-bg">★★★★★</span><span class="stars-fg">★★★★★</span>`;
  const numEl = document.createElement('span');
  numEl.className = 'stats-rating-num';
  numEl.textContent = `${avgRating.toFixed(1)}/10`;
  row.appendChild(starsWrap);
  row.appendChild(numEl);
  wrap.appendChild(row);
}
function showStatsTooltip(e, text){
  const tip = document.getElementById('statsTooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  moveStatsTooltip(e);
}
function moveStatsTooltip(e){
  const tip = document.getElementById('statsTooltip');
  tip.style.left = (e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
}
function hideStatsTooltip(){
  document.getElementById('statsTooltip').style.display = 'none';
}
function loadPublicStats(){
  const t = UI[currentLang];
  const dash = document.getElementById('statsDashboard');
  const loadingEl = document.getElementById('statsLoading');
  if(!FIREBASE_CONFIGURED || !db){
    dash.innerHTML = '';
    loadingEl.style.display = 'block';
    loadingEl.textContent = t.statsNotConfigured;
    return;
  }
  loadingEl.style.display = 'block';
  loadingEl.textContent = t.statsLoading;
  dash.innerHTML = '';
  let q = db.collection('quiz_stats_public');
  const fromVal = document.getElementById('statsFrom').value;
  const toVal = document.getElementById('statsTo').value;
  if(fromVal){
    q = q.where('submittedAt', '>=', new Date(fromVal + 'T00:00:00'));
  }
  if(toVal){
    q = q.where('submittedAt', '<=', new Date(toVal + 'T23:59:59.999'));
  }
  q.get().then(snapshot => {
    let total = 0, passed = 0, sumPct = 0, sumRating = 0, ratingCount = 0;
    const moduleAgg = {}; // { '1': {correct, total}, ..., '6': {...} }
    snapshot.forEach(doc => {
      const d = doc.data();
      total++;
      if(d.passed) passed++;
      sumPct += (typeof d.percentage === 'number') ? d.percentage : 0;
      if(typeof d.rating === 'number'){
        sumRating += d.rating;
        ratingCount++;
      }
      if(d.moduleScores && typeof d.moduleScores === 'object'){
        Object.keys(d.moduleScores).forEach(mKey => {
          const ms = d.moduleScores[mKey] || {};
          if(!moduleAgg[mKey]) moduleAgg[mKey] = {correct:0, total:0};
          moduleAgg[mKey].correct += ms.correct || 0;
          moduleAgg[mKey].total += ms.total || 0;
        });
      }
    });
    const failed = total - passed;
    const avgPct = total ? Math.round(sumPct/total) : 0;
    const avgRating = ratingCount ? (sumRating/ratingCount) : 0;
    loadingEl.style.display = 'none';
    renderStatsTiles({total, passed, failed, avgPct, avgRating, moduleAgg});
  }).catch(err => {
    console.error('Lỗi tải thống kê công khai:', err);
    loadingEl.style.display = 'block';
    loadingEl.textContent = t.statsError;
    dash.innerHTML = '';
    document.getElementById('statsModules').innerHTML = '';
    document.getElementById('statsRating').innerHTML = '';
  });
}
// Sau khi nộp bài xong, bài thi coi như hoàn tất — không cho làm lại trên cùng
// một phiên nữa, chỉ còn nút Thoát. window.close() chỉ thực sự đóng được tab nếu
// tab này được mở bằng script; với tab mở bình thường trình duyệt sẽ chặn (im lặng,
// không báo lỗi) nên luôn hiện thêm hướng dẫn tự đóng tab để chắc chắn người dùng
// biết cách thoát.
function exitTest(){
  const t = UI[currentLang];
  try{ window.close(); }catch(e){}
  const hint = document.getElementById('exitMsg');
  hint.textContent = t.exitHint;
  hint.style.display = 'block';
}
/* ---------- MENU ---------- */
function toggleMenu(forceClose){
  const menu = document.getElementById('dropdownMenu');
  const btn = document.getElementById('btnMenu');
  const backdrop = document.getElementById('menuBackdrop');
  const willOpen = forceClose === true ? false : !menu.classList.contains('open');
  menu.classList.toggle('open', willOpen);
  btn.classList.toggle('open', willOpen);
  backdrop.classList.toggle('open', willOpen);
}
/* ---------- INIT / EVENTS ---------- */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnMenu').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMenu();
  });
  document.getElementById('menuBackdrop').addEventListener('click', () => toggleMenu(true));
  document.querySelectorAll('.dropdown-item:not(.disabled)').forEach(item => {
    item.addEventListener('click', () => toggleMenu(true));
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => renderAll(btn.dataset.lang));
  });
  document.getElementById('btnInstructions').addEventListener('click', () => {
    document.getElementById('instructionsModal').classList.add('open');
  });
  document.getElementById('btnCloseInstr').addEventListener('click', () => {
    document.getElementById('instructionsModal').classList.remove('open');
  });
  document.getElementById('t-btn-start').addEventListener('click', startQuiz);
  document.getElementById('t-btn-submit').addEventListener('click', submitQuiz);
  document.getElementById('btnSubmitResult').addEventListener('click', submitResultToFirebase);
  document.getElementById('btnExit').addEventListener('click', exitTest);
  document.getElementById('btnStatsFilter').addEventListener('click', loadPublicStats);
  document.getElementById('btnStatsReset').addEventListener('click', () => {
    document.getElementById('statsFrom').value = '';
    document.getElementById('statsTo').value = '';
    loadPublicStats();
  });
  document.getElementById('statsToggle').addEventListener('click', () => {
    const toggle = document.getElementById('statsToggle');
    const body = document.getElementById('statsBody');
    const expanded = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!expanded));
    body.style.display = expanded ? 'none' : 'block';
  });
  renderAll('vi');
  loadPublicStats();
});
</script>
