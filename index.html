<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sổ Tay Đào Tạo Kỹ Năng Mềm Chuyên Nghiệp - SF Express</title>
<style>
:root{
  --sf-red:#E11B22; --sf-black:#231F20; --sf-grey:#F4F4F4; --sf-border:#E0E0E0;
  --sf-dark-grey:#333333; --sf-light-red:#FFF5F5; --pass-green:#2E7D32; --fail-red:#C62828;
  --info-blue:#1565C0; --info-bg:#E3F2FD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.6; color:var(--sf-dark-grey); background:#F8F9FA; margin:0;
  padding:clamp(8px,3vw,20px);
}
.container{max-width:900px;margin:0 auto;background:#FFF;padding:clamp(14px,4vw,30px);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.header{text-align:center;border-bottom:3px solid var(--sf-red);padding-bottom:16px;margin-bottom:20px;}
.brand-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
.brand-logo-mark{background:var(--sf-red);color:#fff;font-weight:900;font-size:clamp(16px,4vw,20px);line-height:1;padding:7px 10px;border-radius:6px;letter-spacing:.5px;font-family:Georgia,serif;}
.brand-logo-word{font-weight:800;font-size:clamp(14px,3.6vw,18px);letter-spacing:3px;color:var(--sf-black);}
.brand-title{color:var(--sf-red);font-size:clamp(17px,4.6vw,24px);font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.3px;line-height:1.35;}
.brand-subtitle{color:var(--sf-black);font-size:clamp(12px,3.2vw,14px);font-weight:600;margin-top:6px;}
/* Public stats panel: collapsible tab */
.stats-panel{background:var(--sf-grey);border:1px solid var(--sf-border);border-radius:10px;margin-bottom:20px;overflow:hidden;}
.stats-tab{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff;border:none;padding:14px 16px;font-size:15px;font-weight:700;color:var(--sf-black);cursor:pointer;text-align:left;}
.stats-tab:hover{background:#FAFAFA;}
.stats-tab-arrow{font-size:12px;color:var(--sf-dark-grey);transition:transform .2s ease;}
.stats-tab[aria-expanded="true"] .stats-tab-arrow{transform:rotate(180deg);}
.stats-body{padding:16px;border-top:1px solid var(--sf-border);}
.stats-body-inner{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;}
.stats-filter-col{display:flex;flex-direction:column;gap:8px;min-width:150px;flex:0 0 auto;}
.stats-filter-col label{font-size:12.5px;font-weight:600;color:var(--sf-dark-grey);}
.stats-filter-col input[type=date]{padding:8px 10px;border:1px solid var(--sf-border);border-radius:6px;font-size:13px;min-height:38px;background:#fff;width:100%;}
.stats-filter-btns{display:flex;gap:8px;margin-top:4px;}
.stats-filter-btns button{flex:1;border:none;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px;}
#btnStatsFilter{background:#E4E4E4;color:var(--sf-dark-grey);}
#btnStatsFilter:hover{background:#D2D2D2;}
#btnStatsReset{background:#fff;color:var(--sf-dark-grey);border:1px solid var(--sf-border);}
.stats-dashboard-col{flex:1 1 240px;min-width:220px;}
.stats-dashboard{display:flex;flex-wrap:wrap;gap:20px;align-items:center;}
.stats-donut-wrap{position:relative;flex:0 0 auto;width:140px;height:140px;}
.stats-donut-wrap svg{width:140px;height:140px;}
.stats-donut-seg{cursor:pointer;transition:opacity .15s ease;}
.stats-donut-seg:hover{opacity:.8;}
.stats-donut-center{position:absolute;top:0;left:0;width:140px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.stats-donut-center .stat-num{font-size:22px;font-weight:800;color:var(--sf-black);font-family:Georgia,serif;line-height:1.1;}
.stats-donut-center .stat-label{font-size:10px;color:#666;margin-top:2px;font-weight:600;text-align:center;}
.stats-side-tiles{display:flex;flex-direction:column;gap:6px;flex:1 1 140px;max-width:220px;}
.stat-tile{background:#fff;border:1px solid var(--sf-border);border-radius:8px;padding:7px 12px;text-align:left;cursor:default;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.stat-tile .stat-num{font-size:15px;font-weight:800;color:var(--sf-black);font-family:Georgia,serif;order:2;}
.stat-tile.pass .stat-num{color:var(--pass-green);}
.stat-tile.fail .stat-num{color:var(--fail-red);}
.stat-tile .stat-label{font-size:11px;color:#666;margin-top:0;font-weight:600;order:1;}
.stats-tooltip{position:fixed;pointer-events:none;background:var(--sf-black);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;z-index:200;display:none;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.2);}
.stats-loading,.stats-empty{font-size:13px;color:#777;padding:8px 2px;}
.stats-section-title{font-size:12px;font-weight:700;color:var(--sf-dark-grey);text-transform:uppercase;letter-spacing:.3px;margin-bottom:12px;}
/* Kết quả theo từng kỹ năng (module) */
.stats-modules{margin-top:18px;padding-top:16px;border-top:1px solid var(--sf-border);}
.stats-modules-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:560px){.stats-modules-grid{grid-template-columns:1fr 1fr;column-gap:20px;}}
.module-stat-row{min-width:0;}
.module-stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.module-stat-label{font-size:12.5px;color:var(--sf-black);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.module-stat-pct{font-size:12.5px;font-weight:800;color:var(--sf-black);flex-shrink:0;}
.module-stat-bar{background:var(--sf-grey);border-radius:6px;height:7px;overflow:hidden;}
.module-stat-fill{height:100%;background:var(--pass-green);border-radius:6px;transition:width .3s ease;}
/* Đánh giá mức độ hài lòng (sao vàng) */
.stats-rating{margin-top:18px;padding-top:16px;border-top:1px solid var(--sf-border);}
.stats-rating-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.stars-wrap{position:relative;display:inline-block;font-size:22px;line-height:1;letter-spacing:2px;}
.stars-bg{color:#E0E0E0;}
.stars-fg{position:absolute;top:0;left:0;overflow:hidden;width:var(--fill);white-space:nowrap;color:#F5A623;}
.stats-rating-num{font-size:14px;font-weight:800;color:var(--sf-black);font-family:Georgia,serif;}
/* Top bar: language + instructions, sticky for mobile ease */
.top-bar{position:sticky;top:0;z-index:50;background:#FFF;padding:8px 0;margin:-14px -14px 12px -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--sf-border);}
.top-bar-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;}
/* Hamburger menu */
.menu-wrap{position:relative;flex-shrink:0;}
.btn-menu{background:#FFF;border:1px solid var(--sf-border);border-radius:6px;width:44px;height:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:4px;}
.btn-menu span{display:block;width:20px;height:2.5px;background:var(--sf-black);border-radius:2px;transition:transform .2s,opacity .2s;}
.btn-menu.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.btn-menu.open span:nth-child(2){opacity:0;}
.btn-menu.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.dropdown-menu{display:none;position:absolute;top:52px;left:0;background:#FFF;border:1px solid var(--sf-border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);min-width:260px;max-width:88vw;z-index:90;overflow:hidden;}
.dropdown-menu.open{display:block;}
.dropdown-menu .dm-title{padding:12px 16px 8px;font-size:11px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:.4px;}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--sf-black);cursor:pointer;border-top:1px solid var(--sf-border);}
.dropdown-item:first-of-type{border-top:none;}
.dropdown-item .di-icon{font-size:17px;flex-shrink:0;}
.dropdown-item.active{background:var(--sf-light-red);color:var(--sf-red);}
.dropdown-item.disabled{color:#B0B0B0;cursor:default;}
.dropdown-item .di-badge{margin-left:auto;font-size:10px;font-weight:800;background:#EEE;color:#888;padding:3px 8px;border-radius:10px;text-transform:uppercase;flex-shrink:0;}
.menu-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:80;}
.menu-backdrop.open{display:block;}
.lang-switcher{display:flex;gap:6px;flex-wrap:wrap;}
.lang-btn{background:#FFF;border:1px solid var(--sf-border);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;min-height:40px;}
.lang-btn:hover,.lang-btn.active{background:var(--sf-red);color:#FFF;border-color:var(--sf-red);}
.btn-instructions{background:var(--info-bg);color:var(--info-blue);border:1px solid #90CAF9;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap;}
.btn-instructions:hover{background:#BBDEFB;}
/* Info card / form */
.info-card{background:var(--sf-grey);padding:18px;border-radius:6px;margin-bottom:24px;border-left:4px solid var(--sf-black);}
.info-card h3{margin-top:0;color:var(--sf-black);font-size:15px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:14px;}
.form-group input{width:100%;padding:12px;border:1px solid var(--sf-border);border-radius:4px;font-size:16px;min-height:44px;}
/* Module accordion */
.module-card{border:1px solid var(--sf-border);border-radius:8px;margin-top:18px;overflow:hidden;}
.module-header{background:#FFF;color:var(--sf-black);border-left:4px solid var(--sf-red);border-bottom:1px solid var(--sf-border);padding:14px 16px;font-size:clamp(13px,3.6vw,16px);font-weight:700;text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;user-select:none;transition:background .15s;}
.module-header:hover{background:var(--sf-grey);}
.module-header .chevron{transition:transform .2s;font-size:14px;flex-shrink:0;color:var(--sf-dark-grey);}
.module-header.open .chevron{transform:rotate(180deg);}
.module-body{padding:16px;display:none;}
.module-body.open{display:block;}
.section-title{color:var(--sf-black);border-bottom:2px solid var(--sf-grey);padding-bottom:5px;margin-top:20px;font-size:clamp(13px,3.4vw,15px);}
ul.content-list{padding-left:20px;margin:10px 0;}
ul.content-list li{margin-bottom:8px;font-size:clamp(13px,3.2vw,14px);}
/* Theory / citation boxes */
.theory-box{background:var(--info-bg);border:1px solid #90CAF9;border-left:4px solid var(--info-blue);border-radius:6px;padding:14px;margin:14px 0;font-size:clamp(13px,3.2vw,14px);}
.theory-box .tb-title{font-weight:800;color:var(--info-blue);margin-bottom:6px;font-size:clamp(12.5px,3.2vw,13.5px);text-transform:uppercase;}
.theory-box .tb-source{margin-top:8px;font-size:12px;color:#555;font-style:italic;}
.case-box{background:#FFF8E1;border:1px solid #FFE082;border-left:4px solid #F9A825;border-radius:6px;padding:14px;margin:14px 0;font-size:clamp(13px,3.2vw,14px);}
.case-box .cb-title{font-weight:800;color:#8D6E00;margin-bottom:6px;font-size:clamp(12.5px,3.2vw,13.5px);text-transform:uppercase;}
/* Responsive tables -> stacked cards on mobile */
.table-wrap{width:100%;overflow-x:auto;margin:14px 0;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px;}
th,td{border:1px solid var(--sf-border);padding:10px 12px;text-align:left;vertical-align:top;}
th{background:var(--sf-grey);color:var(--sf-black);font-weight:700;}
th.dos{background:#E8F5E9;color:#2E7D32;}
th.donts{background:#FFEBEE;color:#C62828;}
@media (max-width:620px){
  table.stack, table.stack thead{display:none;}
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%;min-width:0;}
  table.stack{min-width:0;}
  table.stack tr{border:1px solid var(--sf-border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
  table.stack td{border:none;border-bottom:1px solid var(--sf-border);padding:10px 12px;}
  table.stack td:last-child{border-bottom:none;}
  table.stack td::before{content:attr(data-label);display:block;font-weight:700;color:var(--sf-dark-grey);font-size:11.5px;text-transform:uppercase;margin-bottom:4px;}
  .table-wrap{overflow-x:visible;}
}
/* Checklist */
.checklist-box{background:#FAFAFA;border:1px solid var(--sf-border);padding:14px;border-radius:6px;margin:14px 0;}
.checklist-box div{margin-bottom:8px;font-size:clamp(13px,3.2vw,14px);}
/* Flashcards */
.flashcards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
@media (max-width:620px){.flashcards-grid{grid-template-columns:1fr;}}
.card-container{perspective:1000px;min-height:110px;cursor:pointer;}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s;border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;height:100%;min-height:110px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:6px;font-size:13px;text-align:center;}
.card-front{background:#FFF;border:1px solid var(--sf-border);color:var(--sf-black);font-weight:600;}
.card-back{background:var(--sf-light-red);border:1px solid var(--sf-red);color:var(--sf-dark-grey);transform:rotateY(180deg);}
/* Quiz */
.quiz-start-banner{text-align:center;background:var(--sf-grey);padding:26px 16px;border-radius:8px;border:2px dashed var(--sf-dark-grey);margin-top:30px;}
.btn-start{background:var(--sf-red);color:#FFF;border:none;padding:15px 30px;font-size:clamp(14px,4vw,18px);font-weight:800;border-radius:6px;cursor:pointer;box-shadow:0 4px 10px rgba(225,27,34,.3);width:100%;max-width:420px;min-height:52px;}
.btn-start:hover{background:#C11319;}
#quiz-section{display:none;}
.quiz-topbar{position:sticky;top:56px;z-index:40;background:#fff;border:1px solid var(--sf-border);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.timer-badge{font-weight:800;font-size:16px;color:var(--sf-black);background:var(--sf-grey);padding:6px 12px;border-radius:20px;border:1px solid var(--sf-border);}
.timer-badge.low{animation:pulse 1s infinite;color:#fff;background:var(--fail-red);border-color:var(--fail-red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.progress-badge{font-size:13px;color:#555;font-weight:600;}
.question-block{background:#FFF;border:1px solid var(--sf-border);padding:14px;border-radius:6px;margin-bottom:12px;}
.question-title{font-weight:700;margin-bottom:10px;font-size:clamp(13px,3.4vw,14px);color:var(--sf-black);}
.option{display:block;margin-bottom:8px;font-size:clamp(13px,3.3vw,14px);cursor:pointer;padding:10px;border:1px solid var(--sf-border);border-radius:6px;min-height:44px;}
.option:has(input:checked){border-color:var(--sf-red);background:var(--sf-light-red);}
.option input{margin-right:8px;}
.btn-submit{background:var(--sf-red);color:#FFF;border:none;padding:14px 25px;font-size:16px;font-weight:700;border-radius:6px;cursor:pointer;width:100%;margin-top:16px;min-height:52px;}
.btn-submit:hover{background:#C11319;}
.btn-submit:disabled{background:#ccc;cursor:not-allowed;}
/* Result */
#result-block{display:none;background:#FFF;border:1px solid var(--sf-border);border-top:4px solid var(--sf-red);padding:20px;border-radius:8px;margin-top:24px;text-align:center;}
.score-badge{font-size:clamp(24px,7vw,32px);font-weight:800;margin:12px 0;color:var(--sf-black);}
.status-pass{color:var(--pass-green);font-weight:700;font-size:19px;}
.status-fail{color:var(--fail-red);font-weight:700;font-size:19px;}
.trophy{font-size:44px;margin-bottom:8px;}
.rating-box{background:var(--sf-grey);border-radius:8px;padding:16px;margin:18px 0;text-align:left;}
.rating-scale{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
.rating-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--sf-border);background:#fff;font-weight:700;cursor:pointer;font-size:14px;}
.rating-btn.selected{background:var(--sf-red);color:#fff;border-color:var(--sf-red);}
.review-list{text-align:left;max-height:340px;overflow-y:auto;border:1px solid var(--sf-border);border-radius:6px;padding:10px;margin:14px 0;background:#FAFAFA;font-size:12.5px;}
.review-item{padding:8px 6px;border-bottom:1px dashed var(--sf-border);}
.review-item:last-child{border-bottom:none;}
.review-item.correct{color:var(--pass-green);}
.review-item.wrong{color:var(--fail-red);}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;}
.btn-secondary{background:var(--sf-black);color:#fff;border:none;padding:12px 18px;border-radius:6px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:44px;}
.alert-modal{display:none;background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A;padding:12px 16px;border-radius:6px;margin-bottom:15px;font-weight:600;font-size:14px;}
/* Instructions modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;padding:16px;overflow-y:auto;}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center;}
.modal-box{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:20px;margin-top:24px;max-height:88vh;overflow-y:auto;}
.modal-box h3{color:var(--sf-red);margin-top:0;font-size:17px;}
.modal-box ol{padding-left:20px;}
.modal-box li{margin-bottom:10px;font-size:14px;}
.modal-close{background:var(--sf-red);color:#fff;border:none;padding:12px 20px;border-radius:6px;font-weight:700;cursor:pointer;width:100%;margin-top:14px;min-height:46px;}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="top-bar-row">
      <div class="menu-wrap">
        <button class="btn-menu" id="btnMenu" aria-label="Menu"><span></span><span></span><span></span></button>
        <div class="dropdown-menu" id="dropdownMenu">
          <div class="dm-title" id="t-menu-title">Chương trình đào tạo</div>
          <div class="dropdown-item active"><span class="di-icon">🤝</span><span id="t-menu-item1">Kỹ năng mềm</span></div>
          <div class="dropdown-item disabled"><span class="di-icon">📦</span><span id="t-menu-item2">Nghiệp vụ giao nhận hàng</span><span class="di-badge" id="t-menu-soon1">Sắp có</span></div>
          <div class="dropdown-item disabled"><span class="di-icon">🚦</span><span id="t-menu-item3">An toàn giao thông</span><span class="di-badge" id="t-menu-soon2">Sắp có</span></div>
          <div class="dropdown-item disabled"><span class="di-icon">📋</span><span id="t-menu-item4">Quy trình vận hành nội bộ</span><span class="di-badge" id="t-menu-soon3">Sắp có</span></div>
        </div>
      </div>
      <div class="lang-switcher" id="langSwitcher">
        <button class="lang-btn active" data-lang="vi">Tiếng Việt</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>
      <button class="btn-instructions" id="btnInstructions">ℹ️ <span id="t-instr-btn">Hướng dẫn làm bài</span></button>
    </div>
  </div>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="header">
    <div class="brand-logo" aria-hidden="true">
      <span class="brand-logo-mark">SF</span>
      <span class="brand-logo-word">EXPRESS</span>
    </div>
    <h1 class="brand-title" id="t-main-title"></h1>
    <div class="brand-subtitle" id="t-sub-title"></div>
  </div>
  <!-- ===== THỐNG KÊ CÔNG KHAI (số lượng, không hiện tên/email) ===== -->
  <div class="stats-panel" id="statsPanel">
    <button type="button" class="stats-tab" id="statsToggle" aria-expanded="false" aria-controls="statsBody">
      <span id="t-stats-title"></span>
      <span class="stats-tab-arrow" id="statsToggleArrow">▾</span>
    </button>
    <div class="stats-body" id="statsBody" style="display:none;">
      <div class="stats-body-inner">
        <div class="stats-filter-col">
          <label id="t-stats-from-label" for="statsFrom"></label>
          <input type="date" id="statsFrom">
          <label id="t-stats-to-label" for="statsTo"></label>
          <input type="date" id="statsTo">
          <div class="stats-filter-btns">

        rules_version = '2';
        service cloud.firestore {

            // Bản ghi ĐẦY ĐỦ: tên, ID nhân viên, chi tiết từng câu trả lời.
            match /quiz_submissions/{docId} {

{type:'list', heading:{vi:"1. Mục Tiêu & Nguyên Tắc Lắng Nghe Trong Logistics", en:"1. Goals & Principles of Listening in Logistics", zh:"1. 物流场景中倾听的目标与原则"},
 items:[
  {vi:"<strong>Lắng nghe chủ động (Active Listening):</strong> Tập trung chú ý 100% khi khách hàng gửi/nhận hàng hoặc bộ phận điều hành truyền đạt thông tin (yêu cầu vận chuyển, địa điểm giao nhận, hàng dễ vỡ, thời gian hẹn).",
   en:"<strong>Active Listening:</strong> Give 100% attention when a customer is sending/receiving a parcel or when Operations relays information (shipping requests, pickup/drop-off location, fragile items, appointment time).",
   zh:"<strong>主动倾听：</strong>在客户寄/收件或调度部门传达信息（运输要求、收发地点、易碎物品、预约时间）时，做到100%专注。"},
  {vi:"<strong>Không ngắt lời:</strong> Để khách hàng hoặc cấp trên nói hết câu trước khi phản hồi hay đặt câu hỏi làm rõ về đơn hàng.",
   en:"<strong>Don't interrupt:</strong> Let the customer or supervisor finish speaking before responding or asking clarifying questions about the order.",
   zh:"<strong>不要打断：</strong>让客户或上级说完整句话后，再回应或就订单提出澄清问题。"},
  {vi:"<strong>Xác nhận lại thông tin (Paraphrasing):</strong> Nhắc lại ngắn gọn các chi tiết quan trọng để tránh giao sai hàng hoặc nhầm địa chỉ <i>(Ví dụ: \"Dạ, em xác nhận lại kiện hàng này giao tại kho B, yêu cầu kiểm hàng trước đúng không ạ?\")</i>.",
   en:"<strong>Paraphrasing:</strong> Briefly repeat key details back to avoid delivering the wrong parcel or address <i>(e.g., \"Just confirming, this parcel goes to Warehouse B and needs inspection before delivery, correct?\")</i>.",
   zh:"<strong>复述确认：</strong>简要重复关键信息，避免送错货物或地址（例如：\"请确认一下，这件包裹是送到B仓库，并且需要先验货，对吗？\"）。"}
 ]},
{type:'list', heading:{vi:"2. Kỹ Thuật Lắng Nghe Theo Bối Cảnh", en:"2. Context-Based Listening Techniques", zh:"2. 按情境划分的倾听技巧"},
 items:[
  {vi:"<strong>Khi khách hàng đang vội/căng thẳng:</strong> Lắng nghe với thái độ bình tĩnh, ghi nhận ngắn gọn mã vận đơn, tập trung xử lý nhanh thủ tục giao nhận hàng.",
   en:"<strong>When the customer is rushed/stressed:</strong> Listen calmly, note the tracking code briefly, and focus on completing the handover quickly.",
   zh:"<strong>当客户匆忙或情绪紧张时：</strong>保持冷静倾听，简要记录运单号，专注快速完成收发手续。"},
  {vi:"<strong>Khi tiếp nhận chỉ đạo điều hành:</strong> Ghi chép hoặc xác nhận ngay qua ứng dụng/tin nhắn về lộ trình lấy/giao hàng và các lưu ý đặc biệt đối với bưu kiện.",
   en:"<strong>When receiving instructions from Operations:</strong> Note or confirm immediately via app/message the pickup-delivery route and any special notes about the parcel.",
   zh:"<strong>接收调度指令时：</strong>立即通过App或消息记录/确认取送货路线及包裹的特殊注意事项。"}
 ]},
{type:'theory', body:{
  vi:"<strong>Mô hình HURIER</strong> (Judi Brownell, Đại học Cornell, 1985) chia kỹ năng lắng nghe hiệu quả thành 6 thành phần: Hearing (nghe), Understanding (hiểu), Remembering (ghi nhớ), Interpreting (diễn giải), Evaluating (đánh giá) và Responding (phản hồi). Trong ngành logistics, một nghiên cứu kinh điển về hành vi lắng nghe (Ralph Nichols, Đại học Minnesota) chỉ ra rằng người nghe thông thường chỉ giữ lại khoảng 25–50% nội dung ngay sau khi nghe – đây là lý do kỹ thuật <em>paraphrasing</em> (nhắc lại xác nhận) được xem là bắt buộc khi tiếp nhận thông tin đơn hàng, địa chỉ và yêu cầu đặc biệt. Nguyên tắc <strong>7-38-55</strong> của Albert Mehrabian (1971) cũng nhắc tài xế rằng thái độ, giọng điệu và ngôn ngữ cơ thể ảnh hưởng đến cảm nhận của khách hàng nhiều hơn nội dung lời nói khi xử lý tình huống nhạy cảm.",
  en:"The <strong>HURIER Model</strong> (Judi Brownell, Cornell University, 1985) breaks effective listening into six components: Hearing, Understanding, Remembering, Interpreting, Evaluating, and Responding. Classic listening research (Ralph Nichols, University of Minnesota) found that listeners typically retain only about 25–50% of what they hear immediately afterward — this is why <em>paraphrasing</em> is treated as mandatory when receiving order details, addresses, and special instructions. Albert Mehrabian's <strong>7-38-55 rule</strong> (1971) also reminds drivers that attitude, tone, and body language shape a customer's perception more than the words themselves in sensitive situations.",
  zh:"<strong>HURIER模型</strong>（Judi Brownell，康奈尔大学，1985年）将有效倾听分为六个要素：听（Hearing）、理解（Understanding）、记忆（Remembering）、诠释（Interpreting）、评估（Evaluating）和回应（Responding）。经典倾听研究（Ralph Nichols，明尼苏达大学）发现，人们通常在听完后仅能记住约25%-50%的内容——这正是接收订单信息、地址和特殊要求时必须使用「复述确认」技巧的原因。Albert Mehrabian（1971年）提出的<strong>7-38-55法则</strong>也提醒司机：在敏感情境中，态度、语气和肢体语言对客户感受的影响远大于话语内容本身。"
 }, source:{vi:"Nguồn: Brownell, J. (1985) HURIER Model; Nichols, R.G., Univ. of Minnesota listening studies; Mehrabian, A. (1971) Silent Messages.",
   en:"Sources: Brownell, J. (1985) HURIER Model; Nichols, R.G., University of Minnesota listening studies; Mehrabian, A. (1971) Silent Messages.",
   zh:"来源：Brownell, J.（1985）HURIER模型；Nichols, R.G. 明尼苏达大学倾听研究；Mehrabian, A.（1971）《无声的信息》。"}},
{type:'case', body:{
  vi:"<strong>FedEx</strong> đưa lắng nghe khách hàng vào cam kết dịch vụ \"Purple Promise\" (\"Tôi hứa sẽ làm cho mỗi trải nghiệm của khách hàng trở nên nổi bật\"), trong đó nhân viên giao nhận được huấn luyện lắng nghe để phát hiện sớm bất mãn trước khi phát sinh khiếu nại chính thức. <strong>DHL</strong> triển khai chương trình \"First Choice\" dựa trên nguyên lý Lean Six Sigma, khuyến khích nhân viên tuyến đầu ghi nhận phản hồi của khách hàng như một nguồn dữ liệu cải tiến quy trình. Tại Việt Nam, nhiều đơn vị chuyển phát nội địa (Giao Hàng Nhanh, Viettel Post, J&T Express) đều xây dựng kịch bản xác nhận đơn hàng qua điện thoại/tin nhắn trước khi giao – một hình thức lắng nghe chủ động giúp giảm tỷ lệ giao thất bại (delivery failure rate).",
  en:"<strong>FedEx</strong> embeds customer listening into its \"Purple Promise\" (\"I will make every customer experience outstanding\"), training couriers to listen for early signs of dissatisfaction before a formal complaint arises. <strong>DHL's</strong> \"First Choice\" program, built on Lean Six Sigma principles, encourages frontline staff to treat customer feedback as data for process improvement. In Vietnam, domestic carriers such as Giao Hang Nhanh, Viettel Post, and J&T Express all use pre-delivery confirmation calls/messages — a form of active listening that reduces delivery failure rates.",
  zh:"<strong>联邦快递（FedEx）</strong>将倾听客户融入其「紫色承诺」（\"我承诺让每一次客户体验都出色\"），培训收派员在正式投诉产生前就能听出客户不满的早期信号。<strong>DHL</strong>基于精益六西格玛理念推行「First Choice」计划，鼓励一线员工将客户反馈视为流程改进的数据来源。在越南，多家本土快递企业（Giao Hang Nhanh、Viettel Post、J&T Express）在派送前均采用电话/短信确认的方式——这是一种主动倾听，有助于降低派送失败率。"
 }},
{type:'flashcards', items:[
 {q:{vi:"❓ 1. Kỹ thuật Paraphrasing trong lắng nghe khi giao nhận hàng nghĩa là gì?",en:"❓ 1. What does the Paraphrasing technique mean when handling parcels?",zh:"❓ 1. 收发货时的「复述确认」技巧是什么意思？"},
  a:{vi:"💡 Nhắc lại ngắn gọn các chi tiết bưu kiện, địa chỉ và ghi chú giao hàng để xác nhận chính xác 100%.",en:"💡 Briefly repeating parcel details, address, and delivery notes to confirm 100% accuracy.",zh:"💡 简要复述包裹信息、地址和派送备注，以确保100%准确无误。"}},
 {q:{vi:"❓ 2. Vì sao paraphrasing được xem là bắt buộc theo nghiên cứu của Nichols?",en:"❓ 2. Why is paraphrasing considered mandatory based on Nichols' research?",zh:"❓ 2. 根据Nichols的研究，为什么复述确认是必须的？"},
  a:{vi:"💡 Vì người nghe thường chỉ nhớ 25–50% nội dung ngay sau khi nghe, nên cần xác nhận lại để tránh sai sót.",en:"💡 Because listeners usually retain only 25–50% of what they hear, so confirming details prevents mistakes.",zh:"💡 因为听者通常只能记住25%-50%的内容，所以需要复述确认以避免出错。"}},
 {q:{vi:"❓ 3. Khi nhận lệnh điều hành lấy hàng phát sinh, tài xế cần làm gì ngay?",en:"❓ 3. When receiving an urgent pickup order from Operations, what should the driver do immediately?",zh:"❓ 3. 收到调度部门临时取件指令时，司机应立即做什么？"},
  a:{vi:"💡 Xác nhận ngay lộ trình, thời gian Cut-off và các yêu cầu đóng gói hàng hóa.",en:"💡 Immediately confirm the route, cut-off time, and packaging requirements.",zh:"💡 立即确认路线、截单时间和包装要求。"}}
]}
]
},
{
id:'m2',
title:{vi:"02 – Kỹ Năng Giao Tiếp Với Khách Hàng Logistics", en:"02 – Customer Communication Skills in Logistics", zh:"02 – 物流客户沟通技巧"},
blocks:[
{type:'list', heading:{vi:"1. Tác Phong & Quy Chuẩn Giao Tiếp Giao Nhận", en:"1. Conduct & Standards for Pickup/Delivery Communication", zh:"1. 收派件的仪态与沟通规范"},
 items:[
  {vi:"<strong>Chào hỏi & Xưng hô:</strong> Sử dụng lời chào lịch sự, xưng hô tôn trọng (Anh/Chị). Luôn nở nụ cười nhẹ và có thái độ hợp tác.",
   en:"<strong>Greetings:</strong> Use polite greetings and respectful address. Always keep a light smile and a cooperative attitude.",
   zh:"<strong>问候与称呼：</strong>使用礼貌的问候语和尊重的称呼，始终保持微笑和合作的态度。"},
  {vi:"<strong>Ngoại hình & Trang phục:</strong> Đồng phục SF Express gọn gàng, đeo thẻ nhân viên, xe và thùng hàng luôn sạch sẽ.",
   en:"<strong>Appearance & Uniform:</strong> Tidy SF Express uniform, employee badge worn, vehicle and cargo box always clean.",
   zh:"<strong>仪容与着装：</strong>整洁的顺丰制服，佩戴工牌，车辆和货厢始终保持整洁。"},
  {vi:"<strong>Thao tác bưu gửi chuyên nghiệp:</strong> Nâng niu kiện hàng, bưng bê bằng hai tay, đặt hàng nhẹ nhàng, hỗ trợ bưng hàng vào nơi quy định cho khách.",
   en:"<strong>Professional parcel handling:</strong> Handle parcels with care, carry with both hands, place gently, and help carry to the customer's designated spot.",
   zh:"<strong>专业的包裹操作：</strong>轻拿轻放，双手搬运，帮助客户将货物放到指定位置。"}
 ]},
{type:'table', dosDonts:true, heading:{vi:"2. Quy Tắc NÊN & KHÔNG NÊN Trong Giao Tiếp", en:"2. DOs & DON'Ts of Communication", zh:"2. 沟通中的应该与不应该"},
 rows:[
  {dos:{vi:"Chủ động hỗ trợ bưng bê, xếp dỡ kiện hàng giúp khách hàng.",en:"Proactively help carry and unload parcels for the customer.",zh:"主动协助客户搬运、卸载货物。"},
   donts:{vi:"Bàn luận các chủ đề nhạy cảm (chính trị, tôn giáo, đời tư).",en:"Discuss sensitive topics (politics, religion, personal life).",zh:"讨论敏感话题（政治、宗教、隐私）。"}},
  {dos:{vi:"Nói năng rõ ràng, thái độ chuẩn mực, tôn trọng quy định của khách.",en:"Speak clearly, act professionally, and respect the customer's rules.",zh:"表达清晰，态度得体，尊重客户的规定。"},
   donts:{vi:"Quăng quật, ném bưu kiện hoặc kéo lê thùng hàng trên mặt đất.",en:"Throw, toss parcels, or drag boxes on the ground.",zh:"扔摔包裹或在地上拖拽货箱。"}},
  {dos:{vi:"Chủ động hỏi vị trí khách muốn đặt hàng hóa.",en:"Proactively ask where the customer wants the parcel placed.",zh:"主动询问客户希望货物摆放的位置。"},
   donts:{vi:"Tỏ thái độ khó chịu khi hàng nặng, cồng kềnh hoặc khách yêu cầu kiểm tra hàng.",en:"Show annoyance when parcels are heavy/bulky or when customers ask to inspect items.",zh:"因货物笨重或客户要求验货而表现出不耐烦。"}}
 ]},
{type:'theory', body:{
  vi:"<strong>Mô hình SERVQUAL</strong> (Parasuraman, Zeithaml & Berry, 1988) xác định 5 yếu tố khách hàng dùng để đánh giá chất lượng dịch vụ: Độ tin cậy (Reliability), Khả năng đáp ứng (Responsiveness), Sự đảm bảo (Assurance), Sự đồng cảm (Empathy) và Yếu tố hữu hình (Tangibles – gồm cả tác phong, trang phục, tình trạng xe/hàng hóa). Với ngành chuyển phát, \"yếu tố hữu hình\" chiếm tỷ trọng lớn vì khách hàng đánh giá cả doanh nghiệp qua hình ảnh người giao hàng trực tiếp tiếp xúc – đây gọi là hiệu ứng \"điểm chạm cuối cùng\" (last-mile touchpoint), thời điểm duy nhất khách hàng gặp trực tiếp đại diện thương hiệu trong toàn bộ chuỗi cung ứng.",
  en:"The <strong>SERVQUAL model</strong> (Parasuraman, Zeithaml & Berry, 1988) identifies five dimensions customers use to judge service quality: Reliability, Responsiveness, Assurance, Empathy, and Tangibles (including staff conduct, uniform, and vehicle/parcel condition). In courier services, \"Tangibles\" carries extra weight because the courier is often the brand's only human touchpoint the customer ever meets — known as the \"last-mile touchpoint\" effect.",
  zh:"<strong>SERVQUAL模型</strong>（Parasuraman, Zeithaml & Berry，1988年）提出客户评价服务质量的五个维度：可靠性（Reliability）、响应性（Responsiveness）、保证性（Assurance）、同理心（Empathy）和有形性（Tangibles，包括仪表、着装、车辆与货物状况）。在快递行业中，「有形性」权重尤为突出，因为收派员往往是客户在整个供应链中唯一直接接触到的品牌代表——这被称为「最后一公里触点」效应。"
 }, source:{vi:"Nguồn: Parasuraman, A., Zeithaml, V.A., Berry, L.L. (1988) SERVQUAL: A Multiple-Item Scale, Journal of Retailing.",
   en:"Source: Parasuraman, A., Zeithaml, V.A., Berry, L.L. (1988) SERVQUAL: A Multiple-Item Scale, Journal of Retailing.",
   zh:"来源：Parasuraman, A., Zeithaml, V.A., Berry, L.L.（1988）《SERVQUAL多项目量表》，Journal of Retailing。"}},
{type:'case', body:{
  vi:"<strong>UPS</strong> nổi tiếng với chương trình đào tạo \"340 Methods\" – bộ quy chuẩn thao tác chuẩn hóa cho tài xế, bao gồm cả cách cầm chìa khóa, bước lên/xuống xe và cách chào khách nhằm tối ưu vừa tốc độ vừa hình ảnh chuyên nghiệp. <strong>Grab Express</strong> và các nền tảng giao hàng công nghệ tại Đông Nam Á áp dụng hệ thống đánh giá sao (rating) sau mỗi đơn hàng, biến từng tương tác giao tiếp của tài xế thành dữ liệu đo lường chất lượng dịch vụ theo thời gian thực – đây là minh chứng thực tế cho mô hình SERVQUAL trong vận hành hàng ngày.",
  en:"<strong>UPS</strong> is well known for its \"340 Methods\" training — standardized procedures for drivers covering everything from how to hold keys to how to greet customers, optimizing both speed and professional image. <strong>Grab Express</strong> and other tech-enabled delivery platforms in Southeast Asia use post-delivery star ratings, turning every courier interaction into real-time service-quality data — a practical example of the SERVQUAL model in daily operations.",
  zh:"<strong>UPS</strong>以其「340种方法」培训闻名——为司机制定的标准化操作规范，从握钥匙的方式到问候客户的方式，兼顾速度与专业形象。<strong>Grab Express</strong>等东南亚科技配送平台在每单完成后采用星级评分系统，将司机每一次沟通互动转化为实时的服务质量数据——这正是SERVQUAL模型在日常运营中的实际应用。"
 }},
{type:'flashcards', items:[
 {q:{vi:"❓ 1. Quy chuẩn hành vi đối với kiện hàng của khách là gì?",en:"❓ 1. What is the standard for handling a customer's parcel?",zh:"❓ 1. 对待客户包裹的行为规范是什么？"},
  a:{vi:"💡 Bưng bê bằng 2 tay, cẩn thận tuyệt đối không quăng quật hay kéo lê trên đất.",en:"💡 Carry with both hands, never throw or drag it on the ground.",zh:"💡 双手搬运，绝对不能扔摔或在地上拖拽。"}},
 {q:{vi:"❓ 2. Vì sao yếu tố \"hữu hình\" (Tangibles) trong SERVQUAL quan trọng với tài xế giao hàng?",en:"❓ 2. Why does the \"Tangibles\" factor in SERVQUAL matter for delivery drivers?",zh:"❓ 2. 为什么SERVQUAL中的「有形性」因素对配送司机很重要？"},
  a:{vi:"💡 Vì tài xế thường là điểm chạm duy nhất giữa khách hàng và thương hiệu (last-mile touchpoint).",en:"💡 Because the driver is often the only human touchpoint between the customer and the brand.",zh:"💡 因为司机往往是客户与品牌之间唯一的接触点（最后一公里触点）。"}},
 {q:{vi:"❓ 3. Những hành vi nào tuyệt đối cấm khi tiếp xúc khách hàng?",en:"❓ 3. What behaviors are strictly forbidden when interacting with customers?",zh:"❓ 3. 与客户接触时绝对禁止哪些行为？"},
  a:{vi:"💡 Tỏ thái độ gắt gỏng, bàn luận chuyện riêng tư, hoặc làm hư hỏng bao bì hàng hóa.",en:"💡 Being rude, discussing private matters, or damaging the packaging.",zh:"💡 态度粗暴、讨论隐私话题或损坏包装。"}}
]}
]
},
{
id:'m3',
title:{vi:"03 – Kỹ Năng Lái Xe An Toàn & Bảo Vệ Hàng Hóa", en:"03 – Safe Driving & Cargo Protection Skills", zh:"03 – 安全驾驶与货物保护技巧"},
blocks:[
{type:'list', heading:{vi:"1. Nguyên Tắc An Toàn Cốt Lõi (Defensive Driving)", en:"1. Core Safety Principles (Defensive Driving)", zh:"1. 核心安全原则（防御性驾驶）"},
 items:[
  {vi:"<strong>Kiểm tra xe & Thùng hàng trước chuyến đi:</strong> Lốp xe, phanh, đèn, khóa thùng xe, đảm bảo thùng xe khô ráo không rò rỉ nước.",
   en:"<strong>Pre-trip vehicle & cargo box check:</strong> Tires, brakes, lights, box lock; ensure the cargo box is dry with no water leaks.",
   zh:"<strong>行车前检查车辆与货厢：</strong>检查轮胎、刹车、车灯、货厢锁，确保货厢干燥不漏水。"},
  {vi:"<strong>Giữ khoảng cách an toàn:</strong> Áp dụng quy tắc 3 giây (hoặc 6 giây khi trời mưa/đường trơn trượt) để tránh phanh gấp làm đổ vỡ hàng.",
   en:"<strong>Keep a safe following distance:</strong> Apply the 3-second rule (or 6 seconds in rain/slippery roads) to avoid sudden braking that damages cargo.",
   zh:"<strong>保持安全车距：</strong>采用3秒法则（雨天或路滑时为6秒），避免急刹导致货物损坏。"},
  {vi:"<strong>Quan sát tầm xa (15-20 giây phía trước):</strong> Nhận diện sớm nguy cơ để giảm tốc nhẹ nhàng, bảo vệ chất lượng bưu kiện bên trong.",
   en:"<strong>Scan ahead (15–20 seconds):</strong> Spot hazards early to slow down smoothly and protect the parcels inside.",
   zh:"<strong>提前观察路况（15-20秒）：</strong>及早发现风险，平稳减速，保护车内货物质量。"},
  {vi:"<strong>Tuân thủ quy định giao thông:</strong> Không chạy quá tốc độ, tuyệt đối không sử dụng điện thoại khi xe đang di chuyển.",
   en:"<strong>Follow traffic laws:</strong> Never speed, and never use a phone while the vehicle is moving.",
   zh:"<strong>遵守交通法规：</strong>不超速，行车途中绝对禁止使用手机。"}
 ]},
{type:'checklist', heading:{vi:"2. Checklist Vận Chuyển An Toàn", en:"2. Safe Transport Checklist", zh:"2. 安全运输检查清单"},
 items:[
  {vi:"☑ Chằng buộc, cố định kiện hàng cẩn thận trong thùng xe.",en:"☑ Secure and strap down parcels carefully inside the cargo box.",zh:"☑ 在货厢内仔细捆绑固定货物。"},
  {vi:"☑ Hàng nặng xếp dưới, hàng nhẹ/dễ vỡ xếp trên.",en:"☑ Heavy items at the bottom, light/fragile items on top.",zh:"☑ 重物放下方，轻/易碎物品放上方。"},
  {vi:"☑ Khóa chặt thùng xe trong suốt quá trình di chuyển.",en:"☑ Keep the cargo box locked throughout the trip.",zh:"☑ 行驶全程锁紧货厢。"},
  {vi:"☑ Tuân thủ biển báo tốc độ và quy định cấm tải.",en:"☑ Obey speed signs and load restriction regulations.",zh:"☑ 遵守限速标志和限载规定。"}
 ]},
{type:'theory', body:{
  vi:"Quy tắc <strong>3 giây</strong> (tăng lên 6 giây trong điều kiện xấu) được khuyến nghị bởi Cơ quan An toàn Giao thông Đường bộ Quốc gia Hoa Kỳ (<strong>NHTSA</strong>) như khoảng cách phanh an toàn tối thiểu. Chương trình <strong>Smith System</strong> – một trong những hệ thống đào tạo lái xe phòng vệ được sử dụng rộng rãi nhất trong ngành vận tải – đưa ra 5 nguyên tắc cốt lõi: (1) Nhắm xa để thấy toàn cảnh (Aim High in Steering), (2) Quan sát toàn cảnh (Get the Big Picture), (3) Luôn để mắt di chuyển (Keep Your Eyes Moving), (4) Chừa đường thoát hiểm (Leave Yourself an Out), (5) Đảm bảo người khác nhìn thấy mình (Make Sure They See You). Đối với vận chuyển bưu kiện, việc xếp hàng nặng bên dưới còn dựa trên nguyên lý <strong>trọng tâm thấp (low center of gravity)</strong> trong vật lý học – giúp xe ổn định hơn khi vào cua hoặc phanh gấp.",
  en:"The <strong>3-second rule</strong> (extended to 6 seconds in adverse conditions) is recommended by the U.S. National Highway Traffic Safety Administration (<strong>NHTSA</strong>) as a minimum safe following distance. The <strong>Smith System</strong>, one of the most widely used defensive-driving training programs in the transport industry, sets out 5 core keys: Aim High in Steering, Get the Big Picture, Keep Your Eyes Moving, Leave Yourself an Out, and Make Sure They See You. For cargo loading, placing heavy items at the bottom is grounded in the physics principle of a <strong>low center of gravity</strong>, which keeps the vehicle more stable during turns or sudden braking.",
  zh:"<strong>3秒法则</strong>（恶劣条件下延长至6秒）由美国国家公路交通安全管理局（<strong>NHTSA</strong>）建议作为最低安全跟车距离。运输行业广泛采用的防御性驾驶培训体系<strong>史密斯系统（Smith System）</strong>提出五大核心原则：瞄远转向、纵观全局、目光持续移动、留有退路、确保被他人看见。对于货物装载，重物放置于下方也基于物理学中的<strong>低重心原理</strong>，能让车辆在转弯或急刹时更加稳定。"
 }, source:{vi:"Nguồn: NHTSA (National Highway Traffic Safety Administration); Smith System Driver Improvement Institute.",
   en:"Sources: NHTSA (National Highway Traffic Safety Administration); Smith System Driver Improvement Institute.",
   zh:"来源：NHTSA（美国国家公路交通安全管理局）；史密斯系统驾驶提升学院。"}},
{type:'case', body:{
  vi:"<strong>UPS</strong> áp dụng nguyên tắc \"seatbelt-key-mirror\" và huấn luyện tài xế theo chuẩn an toàn nội bộ nghiêm ngặt, được ghi nhận là một trong những đội xe có tỷ lệ tai nạn trên triệu dặm thấp nhất ngành vận tải Hoa Kỳ. <strong>DHL</strong> triển khai chương trình \"GoGreen\" kết hợp lái xe sinh thái (eco-driving) với an toàn – giảm tốc nhẹ nhàng vừa tiết kiệm nhiên liệu vừa bảo vệ hàng hóa dễ vỡ. Tại Việt Nam, <strong>Viettel Post</strong> và <strong>J&T Express</strong> đều trang bị camera hành trình (dashcam) và hệ thống giám sát tốc độ GPS cho đội xe tải liên tỉnh nhằm nhắc nhở tài xế duy trì khoảng cách và tốc độ an toàn theo thời gian thực.",
  en:"<strong>UPS</strong> applies the \"seatbelt-key-mirror\" habit and strict internal safety training, and is recognized for having one of the lowest accident rates per million miles in the U.S. transport industry. <strong>DHL's</strong> \"GoGreen\" program combines eco-driving with safety — gentle deceleration both saves fuel and protects fragile cargo. In Vietnam, <strong>Viettel Post</strong> and <strong>J&T Express</strong> equip their inter-provincial trucks with dashcams and GPS speed-monitoring systems to remind drivers to maintain safe distance and speed in real time.",
  zh:"<strong>UPS</strong>采用「安全带-钥匙-后视镜」习惯并进行严格的内部安全培训，其车队每百万英里事故率位居美国运输业最低之列。<strong>DHL</strong>的「GoGreen」计划将生态驾驶与安全结合——平稳减速既节省燃油又能保护易碎货物。在越南，<strong>Viettel Post</strong>和<strong>J&T Express</strong>都为省际货车配备行车记录仪和GPS测速监控系统，实时提醒司机保持安全车距与车速。"
 }},
{type:'flashcards', items:[
 {q:{vi:"❓ 1. Nguyên tắc xếp dỡ hàng hóa trong thùng xe tải SF là gì?",en:"❓ 1. What is the loading principle for SF cargo trucks?",zh:"❓ 1. 顺丰货车装卸货物的原则是什么？"},
  a:{vi:"💡 Hàng nặng/cồng kềnh xếp ở dưới, hàng nhẹ/dễ vỡ xếp phía trên và chằng buộc chắc chắn.",en:"💡 Heavy/bulky items at the bottom, light/fragile items on top, all secured tightly.",zh:"💡 重物/大件放下方，轻/易碎物品放上方，并牢固捆绑。"}},
 {q:{vi:"❓ 2. Quy tắc 3 giây trong lái xe an toàn đến từ đâu?",en:"❓ 2. Where does the 3-second driving rule originate from?",zh:"❓ 2. 驾驶中的3秒法则来自哪里？"},
  a:{vi:"💡 Khuyến nghị của NHTSA (Mỹ) về khoảng cách an toàn tối thiểu giữa hai xe.",en:"💡 A recommendation from the U.S. NHTSA for the minimum safe following distance.",zh:"💡 美国NHTSA关于车辆间最小安全距离的建议。"}},
 {q:{vi:"❓ 3. Yêu cầu bắt buộc đối với thùng xe chở hàng trước khi di chuyển?",en:"❓ 3. What is mandatory for the cargo box before departure?",zh:"❓ 3. 出车前对货厢有什么强制性要求？"},
  a:{vi:"💡 Kiểm tra sàn sạch/khô, đóng và khóa thùng cẩn thận để tránh rơi rớt/mất mát.",en:"💡 Check the floor is clean/dry, and close and lock the box to prevent loss.",zh:"💡 检查地板干净干燥，仔细关闭并锁好货厢以防丢失。"}}
]}
]
}
];
</script>
<script>
MODULES.push(
{
id:'m4',
title:{vi:"04 – Kỹ Năng Xử Lý Tình Huống Hàng Hóa & Khách Hàng", en:"04 – Handling Cargo & Customer Situations", zh:"04 – 货物与客户突发情况处理"},
blocks:[
{type:'scenario', heading:{vi:"Kịch Bản Xử Lý Tình Huống Thực Tế", en:"Real-World Scenario Handling", zh:"实际情境处理案例"},
 rows:[
  {q:{vi:"1. Khách khiếu nại bưu kiện móp méo / Hàng sự cố",en:"1. Customer complains about a dented/damaged parcel",zh:"1. 客户投诉包裹凹陷/破损"},
   p:{vi:"Bình tĩnh, không tranh cãi. Lắng nghe, cùng khách kiểm tra ngoại quan, lập biên bản sự cố và báo CS/Điều hành.",en:"Stay calm, don't argue. Listen, inspect the parcel together with the customer, file an incident report, and notify CS/Operations.",zh:"保持冷静，不要争辩。倾听客户意见，共同检查外观，填写事故记录并上报客服/调度。"},
   a:{vi:"<i>\"Em rất tiếc về sự cố vỏ hộp này. Em xin phép chụp ảnh hiện trạng và báo ngay về bộ phận CS để xử lý quyền lợi cho mình ạ.\"</i>",en:"<i>\"I'm sorry about the box condition. Let me take a photo and report it to our CS team right away to resolve this for you.\"</i>",zh:"<i>\"很抱歉包装出现这个情况，我马上拍照并上报客服部门，为您处理相关权益。\"</i>"}},
  {q:{vi:"2. Xe gặp sự cố kỹ thuật / Va chạm trên đường",en:"2. Vehicle breakdown / collision on the road",zh:"2. 车辆发生故障/交通事故"},
   p:{vi:"Bật đèn khẩn cấp, tấp xe an toàn. Bảo vệ niêm phong và an toàn hàng hóa trên xe. Báo Điều hành điều xe cứu hộ/chuyển tải.",en:"Turn on hazard lights, pull over safely. Protect the seal and safety of the cargo. Notify Operations for rescue/transshipment.",zh:"打开双闪灯，安全靠边停车。保护货物封条与安全，并上报调度请求救援/转运。"},
   a:{vi:"Báo ngay Điều hành: <i>\"Xe gặp sự cố tại vị trí X, hàng hóa an toàn, cần xe hỗ trợ chuyển tải gấp để kịp ca giao.\"</i>",en:"Notify Operations immediately: <i>\"The vehicle broke down at location X, cargo is safe, need urgent transshipment support to meet the delivery shift.\"</i>",zh:"立即上报调度：\"车辆在X地点发生故障，货物安全，急需支援转运以赶上派送班次。\""}},
  {q:{vi:"3. Kẹt xe / Nguy cơ trễ giờ giao hàng hẹn trước",en:"3. Traffic jam / risk of missing a scheduled delivery time",zh:"3. 交通拥堵/有延误预约送货的风险"},
   p:{vi:"Chủ động kiểm tra danh sách đơn hàng, gọi điện thông báo trước cho người nhận và cập nhật hệ thống.",en:"Proactively check the delivery list, call the recipient in advance, and update the system.",zh:"主动检查订单清单，提前致电收件人告知，并更新系统。"},
   a:{vi:"<i>\"Dạ em chào Anh/Chị, em là tài xế SF Express. Tuyến đường đang kẹt xe nghiêm trọng, em xin phép giao muộn khoảng 20 phút được không ạ?\"</i>",en:"<i>\"Hello, this is your SF Express driver. There's heavy traffic on my route — may I deliver about 20 minutes later than planned?\"</i>",zh:"\"您好，我是顺丰速运司机，目前路上严重拥堵，请问可以晚约20分钟送达吗？\""}},
  {q:{vi:"4. Khách hàng xuất khẩu không đồng ý cho mở kiểm tra hàng đối chiếu Invoice",en:"4. Export customer refuses to let staff open the cargo to check against the Invoice",zh:"4. 出口客户不同意开箱核对发票（Invoice）"},
   p:{vi:"Nhã nhặn giải thích lý do cần đồng kiểm để đảm bảo thông tin khai báo chính xác, giúp lô hàng thông quan và xuất khẩu nhanh chóng, thuận lợi. Nếu khách vẫn từ chối, ghi nhận lại và báo cáo cấp trên/CS để được hướng dẫn xử lý thêm.",en:"Politely explain that joint inspection ensures accurate customs declaration and speeds up smooth clearance and export. If the customer still refuses, note it down and report to a supervisor/CS for further guidance.",zh:"礼貌解释验货核对是为确保申报信息准确，帮助货物顺利、快速通关出口。若客户仍拒绝，记录情况并上报上级/客服以获取进一步指导。"},
   a:{vi:"<i>\"Nhằm phục vụ hỗ trợ hàng hoá của quý Anh/Chị được thông quan và xuất khẩu nhanh nhất có thể, em xin phép được mở kiểm hàng hoá cùng với Anh/Chị để được cùng hỗ trợ nếu cần điều chỉnh về thông tin khai báo trên Invoice ạ.\"</i>",en:"<i>\"To help your shipment clear customs and be exported as quickly as possible, may I open and inspect the cargo together with you, so we can assist right away if the Invoice information needs adjusting?\"</i>",zh:"\"为了协助您的货物尽快通关出口，请允许我与您一同开箱核对，以便在发票申报信息需要调整时能立即为您处理。\""}}
 ]},
{type:'list', heading:{vi:"2. Quy Định Hàng Hóa Xuất Khẩu Cần Lưu Ý", en:"2. Export Cargo Regulations to Note", zh:"2. 出口货物需注意的相关规定"},
 items:[
  {vi:"<strong>Hàng cấm vận chuyển:</strong> Pin Lithium-ion/kim loại rời, ngà voi, sừng và các sản phẩm từ động vật hoang dã cùng các mặt hàng cấm khác theo quy định — tuyệt đối không nhận vận chuyển.",
   en:"<strong>Prohibited items:</strong> Loose lithium-ion/lithium-metal batteries, ivory, horns, and other wildlife products, along with other banned items per regulations — never accept these for shipment.",
   zh:"<strong>禁运物品：</strong>散装锂离子/锂金属电池、象牙、犀牛角及其他野生动物制品，以及其他违禁物品——一律不得收运。"},
  {vi:"<strong>Hàng giá trị cao / khối lượng lớn:</strong> Hàng có giá trị khai báo trên 5.000.000 VNĐ hoặc lô hàng trên 50kg bắt buộc phải lên tờ khai hải quan xuất khẩu theo quy định.",
   en:"<strong>High-value / large shipments:</strong> Cargo declared over 5,000,000 VND or shipments over 50kg must have an export customs declaration filed as required.",
   zh:"<strong>高价值/大批量货物：</strong>申报价值超过500万越南盾或货重超过50公斤的货物，必须按规定办理出口报关单。"},
  {vi:"<strong>Hàng dễ vỡ, hàng lỏng:</strong> Phải được chèn lót và sử dụng vật liệu thấm hút đúng quy cách trước khi đóng gói.",
   en:"<strong>Fragile / liquid items:</strong> Must be cushioned and packed with proper absorbent material before sealing.",
   zh:"<strong>易碎品、液体：</strong>装箱前必须按规定使用缓冲填充物和吸水材料。"},
  {vi:"<strong>Hàng đóng kiện/pallet gỗ:</strong> Bắt buộc kèm theo Chứng thư hun trùng (Fumigation Certificate) bản gốc.",
   en:"<strong>Wooden crates/pallets:</strong> Must be accompanied by an original Fumigation Certificate.",
   zh:"<strong>木质栈板/木箱包装：</strong>必须附上熏蒸证书（Fumigation Certificate）原件。"},
  {vi:"<strong>Hàng đóng pallet:</strong> Tạm thời không được xuất qua các sân bay SZX (Thâm Quyến) hoặc PVG (Phố Đông – Thượng Hải) theo quy định hiện hành của hãng bay.",
   en:"<strong>Palletized cargo:</strong> Currently not accepted for export via SZX (Shenzhen) or PVG (Shanghai Pudong) airports under current airline regulations.",
   zh:"<strong>栈板货物：</strong>根据航空公司现行规定，暂时不能经由深圳（SZX）或上海浦东（PVG）机场出口。"},
  {vi:"<strong>Đổi cảng xuất theo yêu cầu khách:</strong> Khi khách yêu cầu chuyển cảng xuất (ví dụ đổi từ SZX sang PVG), nhân viên giao nhận phải hỗ trợ thực hiện đúng theo yêu cầu của khách.",
   en:"<strong>Changing the export port at the customer's request:</strong> If the customer requests a different export port (e.g., from SZX to PVG), staff must support the change as requested.",
   zh:"<strong>按客户要求更改出口口岸：</strong>若客户要求更改出口口岸（例如由SZX改为PVG），收派员须按客户要求予以协助办理。"}
 ]},
{type:'theory', body:{
  vi:"<strong>Mô hình LAST</strong> (Listen – Apologize – Solve – Thank) là khung xử lý khiếu nại phổ biến trong ngành dịch vụ khách hàng: Lắng nghe trọn vẹn vấn đề, Xin lỗi chân thành (không đổ lỗi), Giải quyết bằng hành động cụ thể, và Cảm ơn khách vì đã phản hồi. Bên cạnh đó, mô hình <strong>OODA Loop</strong> (Observe – Orient – Decide – Act, do Đại tá John Boyd, Không quân Hoa Kỳ phát triển) thường được áp dụng trong xử lý tình huống khẩn cấp trên đường: Quan sát hiện trường → Định hướng mức độ nghiêm trọng → Quyết định phương án → Hành động ngay, giúp tài xế phản ứng có hệ thống thay vì hoảng loạn khi gặp sự cố.",
  en:"The <strong>LAST model</strong> (Listen – Apologize – Solve – Thank) is a common complaint-handling framework in customer service: fully listen to the issue, apologize sincerely (without blaming), solve it with concrete action, and thank the customer for the feedback. The <strong>OODA Loop</strong> (Observe – Orient – Decide – Act, developed by USAF Colonel John Boyd) is often applied to roadside emergencies: observe the scene → assess severity → decide on a course of action → act immediately, helping drivers respond systematically rather than panicking.",
  zh:"<strong>LAST模型</strong>（倾听-道歉-解决-感谢）是客户服务中常见的投诉处理框架：充分倾听问题、真诚道歉（不推卸责任）、以具体行动解决问题、并感谢客户的反馈。<strong>OODA循环</strong>（观察-调整-决策-行动，由美国空军上校John Boyd提出）常用于处理路上突发状况：观察现场→判断严重程度→决定应对方案→立即行动，帮助司机系统化应对而非惊慌失措。"
 }, source:{vi:"Nguồn: mô hình LAST – khung xử lý khiếu nại phổ biến trong đào tạo dịch vụ khách hàng; Boyd, J. (Không quân Hoa Kỳ) OODA Loop.",
   en:"Sources: LAST model, a widely used customer-service complaint framework; Boyd, J. (USAF) OODA Loop.",
   zh:"来源：LAST模型，广泛用于客户服务培训的投诉处理框架；Boyd, J.（美国空军）OODA循环。"}},
{type:'case', body:{
  vi:"<strong>Amazon Logistics</strong> áp dụng nguyên tắc \"Customer Obsession\" – ưu tiên giải quyết vấn đề của khách trước, xử lý trách nhiệm nội bộ sau, giúp rút ngắn thời gian phản hồi khiếu nại. <strong>Ninja Van</strong> (hoạt động tại Đông Nam Á, gồm Việt Nam) xây dựng quy trình báo cáo sự cố qua ứng dụng nội bộ cho tài xế ngay tại hiện trường, tự động định tuyến lại đơn hàng khi phát hiện chậm trễ. Đây là minh chứng cho việc kết hợp con người (kỹ năng xử lý tình huống) với công nghệ (hệ thống định tuyến tự động) trong vận hành logistics hiện đại.",
  en:"<strong>Amazon Logistics</strong> applies \"Customer Obsession\" — resolving the customer's problem first, sorting out internal accountability afterward, which shortens complaint response time. <strong>Ninja Van</strong> (operating across Southeast Asia, including Vietnam) built an in-app incident reporting flow for drivers at the scene, automatically rerouting orders when delays are detected — an example of combining human situational skills with automated routing technology in modern logistics.",
  zh:"<strong>亚马逊物流（Amazon Logistics）</strong>秉持「客户至上」原则——优先解决客户问题，事后再厘清内部责任，从而缩短投诉响应时间。<strong>Ninja Van</strong>（在包括越南在内的东南亚地区运营）为司机建立了现场App事故上报流程，一旦发现延误即自动重新规划路线——这体现了现代物流运营中人工处理能力与自动化路由技术的结合。"
 }},
{type:'flashcards', items:[
 {q:{vi:"❓ 1. Cần làm gì khi phát hiện hàng hóa bị hư hỏng/móp méo lúc giao hàng?",en:"❓ 1. What should you do when you find damaged/dented cargo during delivery?",zh:"❓ 1. 派送时发现货物破损/凹陷该怎么办？"},
  a:{vi:"💡 Giữ thái độ bình tĩnh, chụp ảnh hiện trạng, ghi nhận lên biên bản/hệ thống và báo điều hành/CS.",en:"💡 Stay calm, photograph the condition, log it in the report/system, and notify Operations/CS.",zh:"💡 保持冷静，拍照记录现状，登记到记录/系统中，并上报调度/客服。"}},
 {q:{vi:"❓ 2. Bước đầu tiên trong mô hình LAST khi xử lý khiếu nại là gì?",en:"❓ 2. What is the first step in the LAST model for complaint handling?",zh:"❓ 2. LAST投诉处理模型的第一步是什么？"},
  a:{vi:"💡 Listen – Lắng nghe trọn vẹn vấn đề của khách trước khi phản hồi.",en:"💡 Listen – fully hear the customer's issue before responding.",zh:"💡 倾听（Listen）——在回应前充分了解客户的问题。"}},
 {q:{vi:"❓ 3. Phải làm gì khi dự đoán không thể đến giao hàng đúng giờ hẹn?",en:"❓ 3. What should you do if you anticipate missing the scheduled delivery time?",zh:"❓ 3. 预计无法按约定时间送达时该怎么办？"},
  a:{vi:"💡 Gọi điện xin lỗi và hẹn lại thời gian cụ thể với khách hàng trước khi trễ hạn.",en:"💡 Call to apologize and give a specific new time before the deadline passes.",zh:"💡 提前致电道歉，并告知客户具体的新送达时间。"}}
]}
]
},
{
id:'m5',
title:{vi:"05 – Kỹ Năng Quản Lý Thời Gian & Lịch Trình Giao Hàng", en:"05 – Time & Delivery Schedule Management", zh:"05 – 时间与派送计划管理"},
blocks:[
{type:'list', heading:{vi:"1. Nguyên Tắc Quản Lý Lịch Trình Tối Ưu", en:"1. Principles of Optimal Schedule Management", zh:"1. 高效日程管理原则"},
 items:[
  {vi:"<strong>Lập kế hoạch tuyến đường (Route Optimization):</strong> Sắp xếp thứ tự các điểm lấy/giao hàng theo lộ trình ngắn nhất và hợp lý nhất trước khi xuất kho.",
   en:"<strong>Route Optimization:</strong> Sequence pickup/delivery stops along the shortest, most logical route before leaving the depot.",
   zh:"<strong>路线优化：</strong>出库前按最短、最合理的路线安排取送货顺序。"},
  {vi:"<strong>Tuân thủ khung giờ Cut-off & Lịch hẹn:</strong> Đảm bảo lấy hàng kịp thời gian xuất chuyến cố định và giao đúng khung giờ cam kết với khách.",
   en:"<strong>Follow Cut-off times & appointments:</strong> Ensure pickups meet the fixed dispatch time and deliveries meet the committed time window.",
   zh:"<strong>遵守截单时间与预约：</strong>确保按固定发车时间完成取件，并在承诺的时间段内送达。"},
  {vi:"<strong>Cam kết giờ hẹn với khách hàng:</strong> Khi khách hẹn giờ cụ thể để giao/nhận hàng (VD: 10:00 sáng hôm sau), nhân viên phải chủ động sắp xếp lịch trình để đáp ứng đúng hẹn, lấy khách hàng làm trọng tâm. Trường hợp bất khả kháng không thể sắp xếp được, phải chủ động gọi điện thông báo, thỏa thuận lại và chỉ thay đổi khi nhận được sự đồng ý của khách.",
   en:"<strong>Honoring appointment times with customers:</strong> When a customer sets a specific pickup/delivery time (e.g., 10:00 AM the next day), staff must proactively arrange their schedule to meet it, keeping the customer at the center. If this is truly impossible, staff must proactively call to explain, renegotiate, and only change the plan once the customer agrees.",
   zh:"<strong>信守与客户的预约时间：</strong>当客户约定具体的取/送货时间（例如次日上午10:00）时，员工须主动调整行程以准时履约，坚持以客户为中心。如确实存在不可抗力无法按约定完成，须主动致电说明并重新协商，仅在获得客户同意后才可变更安排。"},
  {vi:"<strong>Nghỉ ngơi khoa học:</strong> Không lái xe liên tục quá 4 giờ; nghỉ 15-20 phút giữa ca để giữ sự tỉnh táo.",
   en:"<strong>Scientific rest breaks:</strong> Do not drive continuously for more than 4 hours; rest 15–20 minutes between shifts to stay alert.",
   zh:"<strong>科学休息：</strong>连续驾驶不超过4小时；每班次间休息15-20分钟保持清醒。"}
 ]},
{type:'list', heading:{vi:"2. Tối Ưu Thời Gian Vận Hành Dịch Vụ", en:"2. Optimizing Service Operation Time", zh:"2. 服务运营时间优化"},
 items:[
  {vi:"Bảo dưỡng, rửa xe, nạp nhiên liệu vào khoảng thời gian nghỉ giữa ca hoặc ngoài giờ cao điểm giao nhận.",en:"Do maintenance, washing, and refueling during breaks or off-peak hours.",zh:"在班次休息或非高峰时段进行保养、洗车和加油。"},
  {vi:"Cập nhật ngay trạng thái giao hàng trên APP để Điều hành và Khách hàng theo dõi realtime.",en:"Update delivery status on the app immediately so Operations and customers can track it in real time.",zh:"立即在App上更新派送状态，方便调度和客户实时跟踪。"}
 ]},
{type:'theory', body:{
  vi:"<strong>Ma trận Eisenhower</strong> (được đặt theo tên Tổng thống Dwight D. Eisenhower) phân loại công việc theo 2 trục Khẩn cấp – Quan trọng, giúp tài xế ưu tiên xử lý đơn hàng có khung giờ Cut-off gần nhất trước, thay vì xử lý theo thứ tự nhận việc ngẫu nhiên. Về mặt vận hành, bài toán sắp xếp lộ trình giao nhận tối ưu (tối thiểu hóa quãng đường qua tất cả các điểm) chính là dạng ứng dụng thực tế của bài toán <strong>Vehicle Routing Problem (VRP)</strong> trong toán tối ưu – nền tảng thuật toán cho hầu hết phần mềm định tuyến giao hàng hiện nay. Về giới hạn giờ lái xe, nhiều quốc gia (bao gồm quy định vận tải đường bộ tại Việt Nam) giới hạn thời gian lái xe liên tục ở mức 4 giờ nhằm giảm nguy cơ tai nạn do mất tập trung/buồn ngủ.",
  en:"The <strong>Eisenhower Matrix</strong> (named after President Dwight D. Eisenhower) sorts tasks along Urgent–Important axes, helping drivers prioritize orders with the nearest cut-off time rather than handling them in random order. Operationally, optimizing delivery routes (minimizing total distance across all stops) is a real-world application of the <strong>Vehicle Routing Problem (VRP)</strong> in optimization mathematics — the algorithmic foundation behind most modern delivery-routing software. Regarding driving-hour limits, many countries (including Vietnam's road transport regulations) cap continuous driving at 4 hours to reduce accident risk from fatigue and loss of focus.",
  zh:"<strong>艾森豪威尔矩阵</strong>（以美国总统德怀特·艾森豪威尔命名）按「紧急-重要」两个维度对任务分类，帮助司机优先处理截单时间最近的订单，而非按随机顺序处理。在运营层面，优化派送路线（使途经所有站点的总里程最小化）正是运筹优化中<strong>车辆路径问题（VRP）</strong>的实际应用——这是当今大多数派送路线软件的算法基础。关于驾驶时长限制，包括越南道路运输法规在内的许多国家都将连续驾驶时间限制在4小时以内，以降低因疲劳/注意力不集中导致的事故风险。"
 }, source:{vi:"Nguồn: Eisenhower Matrix (mô hình quản lý thời gian phổ biến); Dantzig, G. & Ramser, J. (1959) The Truck Dispatching Problem – nền tảng lý thuyết VRP; quy định về thời gian lái xe liên tục trong vận tải đường bộ.",
   en:"Sources: Eisenhower Matrix (popular time-management model); Dantzig, G. & Ramser, J. (1959) The Truck Dispatching Problem – foundation of VRP theory; road transport regulations on continuous driving hours.",
   zh:"来源：艾森豪威尔矩阵（常见的时间管理模型）；Dantzig, G. & Ramser, J.（1959）《卡车调度问题》——VRP理论基础；道路运输关于连续驾驶时间的法规。"}},
{type:'case', body:{
  vi:"<strong>DHL</strong> và <strong>FedEx</strong> đều sử dụng phần mềm định tuyến tự động dựa trên thuật toán VRP để tính lộ trình tối ưu cho hàng nghìn điểm giao nhận mỗi ngày, giảm đáng kể quãng đường di chuyển thừa. Tại Việt Nam, <strong>Giao Hàng Tiết Kiệm (GHTK)</strong> và <strong>J&T Express</strong> áp dụng hệ thống phân tuyến tự động (auto-routing) kết hợp với khung giờ Cut-off theo từng bưu cục để tối đa hóa số đơn giao trong ca làm việc. Nguyên tắc chung của các doanh nghiệp hàng đầu là: công nghệ hỗ trợ tính toán lộ trình, còn con người (tài xế) quyết định điều chỉnh linh hoạt theo tình huống thực tế trên đường.",
  en:"Both <strong>DHL</strong> and <strong>FedEx</strong> use automated routing software based on VRP algorithms to calculate optimal routes for thousands of daily stops, significantly cutting wasted travel distance. In Vietnam, <strong>Giao Hang Tiet Kiem (GHTK)</strong> and <strong>J&T Express</strong> use auto-routing systems combined with per-hub cut-off times to maximize deliveries per shift. The common principle among leading companies: technology computes the route, while the human driver makes real-time adjustments as road conditions change.",
  zh:"<strong>DHL</strong>和<strong>联邦快递</strong>均使用基于VRP算法的自动路线规划软件，为每天数千个收发点计算最优路线，大幅减少无效行驶里程。在越南，<strong>Giao Hang Tiet Kiem（GHTK）</strong>和<strong>J&T Express</strong>采用自动分单系统，并结合各网点的截单时间，最大化每班次的派送量。行业领先企业的共同原则是：技术负责计算路线，而司机（人）根据路上实际情况灵活调整。"
 }},
{type:'flashcards', items:[
 {q:{vi:"❓ 1. Việc sắp xếp thứ tự đơn hàng trước khi rời kho mang lại lợi ích gì?",en:"❓ 1. What is the benefit of sequencing orders before leaving the depot?",zh:"❓ 1. 出库前对订单排序有什么好处？"},
  a:{vi:"💡 Tiết kiệm thời gian di chuyển, giảm chi phí nhiên liệu và đảm bảo tỷ lệ giao hàng đúng giờ.",en:"💡 Saves travel time, reduces fuel cost, and improves on-time delivery rate.",zh:"💡 节省行车时间，降低油耗，并保障准时派送率。"}},
 {q:{vi:"❓ 2. Bài toán tối ưu lộ trình giao hàng trong toán học được gọi là gì?",en:"❓ 2. What is the mathematical name for the delivery route optimization problem?",zh:"❓ 2. 派送路线优化在数学中被称为什么问题？"},
  a:{vi:"💡 Vehicle Routing Problem (VRP) – Bài toán định tuyến phương tiện.",en:"💡 The Vehicle Routing Problem (VRP).",zh:"💡 车辆路径问题（VRP）。"}},
 {q:{vi:"❓ 3. Cần làm gì ngay khi hoàn thành giao một kiện hàng?",en:"❓ 3. What should you do right after completing a delivery?",zh:"❓ 3. 完成一单派送后应立即做什么？"},
  a:{vi:"💡 Cập nhật ngay trạng thái \"Đã giao thành công\" lên ứng dụng vận hành.",en:"💡 Immediately update the \"Delivered successfully\" status on the operations app.",zh:"💡 立即在运营App上更新「已成功送达」状态。"}}
]}
]
},
{
id:'m6',
title:{vi:"06 – Kỹ Năng Làm Việc Nhóm & Phối Hợp Vận Hành", en:"06 – Teamwork & Operational Coordination Skills", zh:"06 – 团队协作与运营协调技巧"},
blocks:[
{type:'list', heading:{vi:"1. Hợp Tác Trong Chuỗi Logistics SF Express", en:"1. Collaboration Across the SF Express Logistics Chain", zh:"1. 顺丰速运物流链中的协作"},
 items:[
  {vi:"<strong>Phối hợp với Bộ phận Điều hành:</strong> Cập nhật trạng thái chuyến đi kịp thời (Đã lấy hàng, Đang vận chuyển, Đã hoàn thành). Báo cáo ngay khi có phát sinh thay đổi lộ trình.",en:"<strong>Coordinate with Operations:</strong> Update trip status promptly (Picked up, In transit, Completed). Report immediately when the route changes.",zh:"<strong>与调度部门协作：</strong>及时更新行程状态（已取件、运输中、已完成）。路线变更时立即上报。"},
  {vi:"<strong>Phối hợp với Nhân viên Kho / Chia chọn hàng (Sorter/Warehouse):</strong> Phân công kiểm đếm, đối soát số lượng bưu kiện, ký nhận bàn giao hàng hóa chính xác.",en:"<strong>Coordinate with Warehouse/Sorting staff:</strong> Count and reconcile parcel quantities, and sign off handovers accurately.",zh:"<strong>与仓库/分拣人员协作：</strong>清点核对包裹数量，准确签收交接货物。"},
  {vi:"<strong>Hỗ trợ Đồng nghiệp (Đội ngũ tài xế):</strong> Chia sẻ thông tin giao thông, tuyến đường cấm/ngập nước; hỗ trợ đồng nghiệp cứu hộ hàng hóa khi gặp sự cố trên đường.",en:"<strong>Support fellow drivers:</strong> Share traffic info and flooded/restricted routes; help rescue cargo when a colleague has an incident.",zh:"<strong>支持同事（司机团队）：</strong>共享交通信息、禁行/积水路段；同事出现状况时协助抢救货物。"},
  {vi:"<strong>Hỗ trợ khi đồng nghiệp nghỉ phép/nghỉ đột xuất:</strong> Có tinh thần hỗ trợ, tuân theo sự điều động sắp xếp tuyến đường từ quản lý để đảm bảo không ảnh hưởng dịch vụ của các đơn giao/nhận hàng trên tuyến mà đồng nghiệp đó phụ trách.",en:"<strong>Covering for colleagues on leave/sudden absence:</strong> Maintain a supportive spirit and follow the route reassignment arranged by the manager to ensure the delivery/pickup service on that colleague's route is not affected.",zh:"<strong>同事请假或临时缺勤时的支援：</strong>发扬互助精神，服从主管对路线的重新调度安排，确保该同事负责的收派线路服务不受影响。"}
 ]},
{type:'list', heading:{vi:"2. Văn Hóa Ứng Xử Tổ Chức", en:"2. Organizational Culture & Conduct", zh:"2. 组织行为文化"},
 items:[
  {vi:"Bàn giao ca xe đầy đủ: Kiểm tra nhiên liệu, vệ sinh cabin/thùng xe, tình trạng kỹ thuật và giấy tờ xe.",en:"Full shift handover: check fuel, clean the cabin/cargo box, technical condition, and vehicle documents.",zh:"完整交接班：检查油量、清洁驾驶室/货厢、车辆技术状况和相关证件。"},
  {vi:"Góp ý tích cực trong các buổi họp đội xe nhằm nâng cao tỷ lệ giao hàng thành công (PCR).",en:"Give constructive feedback in fleet meetings to improve the Parcel Completion Rate (PCR).",zh:"在车队会议上积极建言，以提升派送成功率（PCR）。"}
 ]},
{type:'theory', body:{
  vi:"<strong>Mô hình phát triển nhóm Tuckman</strong> (Bruce Tuckman, 1965) mô tả 5 giai đoạn một đội nhóm trải qua: Hình thành (Forming) – Xung đột (Storming) – Chuẩn hóa (Norming) – Vận hành hiệu quả (Performing) – Kết thúc (Adjourning). Đội xe SF Express, dù luân chuyển ca kíp liên tục, vẫn cần đạt giai đoạn \"Norming/Performing\" thông qua quy trình bàn giao chuẩn hóa và kênh liên lạc chung (nhóm chat đội xe), giúp giảm thời gian \"làm quen lại\" mỗi khi đổi ca. Ngoài ra, khái niệm <strong>PCR (Parcel Completion Rate – Tỷ lệ giao hàng thành công)</strong> là một chỉ số KPI phổ biến trong ngành logistics, phản ánh trực tiếp hiệu quả phối hợp giữa tài xế – kho – điều hành, vì một đơn hàng thất bại thường xuất phát từ đứt gãy thông tin ở một trong ba mắt xích này.",
  en:"<strong>Tuckman's stages of group development</strong> (Bruce Tuckman, 1965) describe 5 phases a team goes through: Forming – Storming – Norming – Performing – Adjourning. Even with constant shift rotation, an SF Express fleet needs to reach the \"Norming/Performing\" stage through standardized handover procedures and a shared communication channel (fleet group chat), reducing the \"re-familiarization\" time at every shift change. The <strong>Parcel Completion Rate (PCR)</strong> is a common logistics KPI that directly reflects coordination quality between driver, warehouse, and operations — a failed delivery usually stems from a breakdown in communication at one of these three links.",
  zh:"<strong>塔克曼团队发展阶段模型</strong>（Bruce Tuckman，1965年）描述团队经历的五个阶段：形成期（Forming）—震荡期（Storming）—规范期（Norming）—高效期（Performing）—解散期（Adjourning）。顺丰车队虽然频繁轮班，仍需通过标准化交接流程与共同沟通渠道（车队群聊）达到「规范期/高效期」，从而减少每次换班的「重新磨合」时间。<strong>派送完成率（PCR, Parcel Completion Rate）</strong>是物流行业常见的KPI指标，直接反映司机-仓库-调度三方协作的效果，因为派送失败通常源于这三个环节之一的信息断层。"
 }, source:{vi:"Nguồn: Tuckman, B.W. (1965) Developmental Sequence in Small Groups, Psychological Bulletin.",
   en:"Source: Tuckman, B.W. (1965) Developmental Sequence in Small Groups, Psychological Bulletin.",
   zh:"来源：Tuckman, B.W.（1965）《小群体的发展序列》，Psychological Bulletin。"}},
{type:'case', body:{

<script>

let lastStatsResult = null; // cache of last loaded public stats {total,passed,failed,avgPct}, so language switches don't re-query Firestore
function shuffleArray(array){
  let arr = [...array];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function esc(s){ return s; } // content is trusted static i18n data (may include safe <strong>/<i> tags)
function escUser(s){ // escape untrusted, user-typed form input before it is placed into innerHTML
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
/* ---------- RENDER MODULES ---------- */
function renderModules(lang){
  const t = UI[lang];
  const container = document.getElementById('modules-container');
  container.innerHTML = '';
  MODULES.forEach((mod, idx) => {
    const card = document.createElement('div');
    card.className = 'module-card';
    const header = document.createElement('div');
    header.className = 'module-header';
    header.innerHTML = `<span>${mod.title[lang]}</span><span class="chevron">▼</span>`;
    header.onclick = () => {
      header.classList.toggle('open');
      body.classList.toggle('open');
    };
    const body = document.createElement('div');
    body.className = 'module-body';
    body.innerHTML = `<div style="color:#999;font-size:12px;margin-bottom:6px;">${t.moduleHint}</div>`;
    mod.blocks.forEach(block => {
      if(block.type === 'list'){
        const h = document.createElement('h3');
        h.className = 'section-title';
        h.textContent = block.heading[lang];
        body.appendChild(h);
        const ul = document.createElement('ul');
        ul.className = 'content-list';
        block.items.forEach(it => {
          const li = document.createElement('li');
          li.innerHTML = it[lang];
          ul.appendChild(li);
        });
        body.appendChild(ul);
      } else if(block.type === 'theory'){
        const div = document.createElement('div');
        div.className = 'theory-box';
        div.innerHTML = `<div class="tb-title">${t.theoryLabel}</div><div>${block.body[lang]}</div><div class="tb-source">${block.source[lang]}</div>`;
        body.appendChild(div);
      } else if(block.type === 'case'){
        const div = document.createElement('div');
        div.className = 'case-box';
        div.innerHTML = `<div class="cb-title">${t.caseLabel}</div><div>${block.body[lang]}</div>`;
        body.appendChild(div);
      } else if(block.type === 'table' && block.dosDonts){
        const h = document.createElement('h3');
        h.className = 'section-title';
        h.textContent = block.heading[lang];
        body.appendChild(h);
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        let rowsHtml = '';
        block.rows.forEach(r => {
          rowsHtml += `<tr><td data-label="${t.dosLabel}">${r.dos[lang]}</td><td data-label="${t.dontsLabel}">${r.donts[lang]}</td></tr>`;
        });
        wrap.innerHTML = `<table class="stack"><thead><tr><th class="dos">${t.dosLabel}</th><th class="donts">${t.dontsLabel}</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
        body.appendChild(wrap);
      } else if(block.type === 'checklist'){
        const h = document.createElement('h3');
        h.className = 'section-title';
        h.textContent = block.heading[lang];
        body.appendChild(h);
        const box = document.createElement('div');
        box.className = 'checklist-box';
        block.items.forEach(it => {
          const d = document.createElement('div');
          d.textContent = it[lang];
          box.appendChild(d);
        });
        body.appendChild(box);
      } else if(block.type === 'scenario'){
        const h = document.createElement('h3');
        h.className = 'section-title';
        h.textContent = block.heading[lang];
        body.appendChild(h);
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        let rowsHtml = '';
        block.rows.forEach(r => {
          rowsHtml += `<tr><td data-label="${t.scenarioLabel1}"><strong>${r.q[lang]}</strong></td><td data-label="${t.scenarioLabel2}">${r.p[lang]}</td><td data-label="${t.scenarioLabel3}">${r.a[lang]}</td></tr>`;
        });
        wrap.innerHTML = `<table class="stack"><thead><tr><th>${t.scenarioLabel1}</th><th>${t.scenarioLabel2}</th><th>${t.scenarioLabel3}</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
        body.appendChild(wrap);
      } else if(block.type === 'flashcards'){
        const h = document.createElement('h3');
        h.className = 'section-title';
        h.textContent = t.flashcardHead;
        body.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'flashcards-grid';
        block.items.forEach(fc => {
          const cc = document.createElement('div');
          cc.className = 'card-container';
          cc.onclick = () => cc.querySelector('.card').classList.toggle('flipped');
          cc.innerHTML = `<div class="card">
            <div class="card-face card-front">${fc.q[lang]}</div>
            <div class="card-face card-back">${fc.a[lang]}</div>
          </div>`;
          grid.appendChild(cc);
        });
        body.appendChild(grid);
      }
    });
    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function renderAll(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
